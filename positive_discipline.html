<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和美智慧校園｜正向管教自我檢核</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f8f3;color:#244233;font:16px/1.5 "Microsoft JhengHei",sans-serif}.app{max-width:820px;margin:auto;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:24px;margin:0}.version{font-size:12px;color:#637a6a}button,input,select{font:inherit}button{padding:11px 14px;border:1px solid #adcbb6;border-radius:12px;background:#e5f2e9;color:#246141;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:default}.back{background:#47856a;color:white;white-space:nowrap}.row{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.row>*{flex:1;min-width:0}.status{border-radius:12px;padding:12px;background:#e0eee5;white-space:pre-wrap}.status.error{background:#ffe5e5;color:#a22525}.card{background:white;border:1px solid #d4e4d9;border-radius:15px;padding:14px;margin:12px 0}h2{font-size:21px;margin:12px 0 4px}.meta{font-size:14px;white-space:pre-wrap;color:#557362}.question{border-bottom:1px solid #e3ebe6;padding:14px 0}.question:last-child{border:0}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.choices button{padding:10px 4px}.choices button.selected{background:#28794e;color:white;border-color:#28794e}.answer{margin-top:8px;color:#236a44;font-weight:bold}.toolbar{position:sticky;bottom:0;background:#f2f8f3f5;padding:10px 0}.ack label{display:flex;align-items:flex-start;gap:10px;font-weight:bold}.ack input{width:24px;height:24px;flex-shrink:0;margin-top:2px}.ack small{display:block;color:#557362;margin-top:7px}input[type="month"]{width:100%;min-width:0;max-width:100%;height:46px;padding:9px;margin-top:5px;border:1px solid #afc6b7;border-radius:10px;background:white;box-sizing:border-box;-webkit-appearance:none}.record{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #dbe7df}.record button{flex-shrink:0}.roster{white-space:pre-wrap}.note{color:#557362;font-size:14px}[hidden]{display:none!important}
</style></head><body><main class="app"><header><div><h1>🌱 正向管教自我檢核</h1><div class="version">v1.1.0｜2026-10-14</div></div><button id="back" class="back" type="button">← 返回</button></header><div id="status" class="status" role="status">正在讀取…</div><div class="row"><button id="current" type="button">本月檢核</button><button id="history" type="button">歷史紀錄</button><button id="reload" type="button">重新讀取</button><button id="printBook" type="button" hidden>列印成冊</button></div>
<section id="listPanel" hidden><label>評量月份<input id="month" type="month"></label><div id="roster" class="card roster" hidden></div><div id="records" class="card"></div></section>
<section id="formPanel" hidden><h2 id="title"></h2><div id="meta" class="meta"></div><p id="instruction" class="note"></p><div id="questions" class="card"></div><div id="progress" class="note"></div><div id="teacherActions" class="row toolbar" hidden><button id="draft" type="button">暫存</button><button id="submit" type="button">完成並送出</button></div><div id="ackPanel" class="card ack" hidden><label><input id="acknowledged" type="checkbox" disabled><span>我已閱覽本表全部15題</span></label><small id="ackInfo"></small></div></section></main>
<script src="self_eval_client.js?v=1.0.0"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const target=new URLSearchParams(location.search).get('id');let boot,record,answers=[],busy=false,historyMode=false,pending=null;const localRecords=new Map();
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function stamp(value){return value?new Date(value).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):''}
function key(){return 'heremay.positive.draft.'+boot.employee.employeeNo+'.'+record.id}
function keep(){try{localStorage.setItem(key(),JSON.stringify({revision:record.revision||0,answers}))}catch(_){status('本機暫存空間不足，請按暫存保存到系統。',true)}}
function progress(){$('progress').textContent='已選填 '+answers.filter(v=>boot.bank.choices.includes(v)).length+'／15題'}
function showForm(value){record=value;if(record.version!==boot.bank.version){status('題庫版本不符，請重新讀取或聯絡主管。',true);return}const editable=boot.role!=='admin'&&record.status==='草稿';answers=(record.answers||Array(15).fill(null)).slice();if(editable)try{const cached=JSON.parse(localStorage.getItem(key())||'null');if(cached?.revision===(record.revision||0)&&Array.isArray(cached.answers)&&cached.answers.length===15)answers=cached.answers.map(x=>boot.bank.choices.includes(x)?x:null)}catch(_){}
$('listPanel').hidden=true;$('formPanel').hidden=false;$('title').textContent=record.month+'｜'+record.name+'｜'+record.department;$('meta').textContent='狀態：'+record.status+(record.submittedAt?'\n提交時間：'+stamp(record.submittedAt):'')+(record.acknowledgedAt?'\n園長已閱：'+record.acknowledgedBy+'｜'+stamp(record.acknowledgedAt):'');$('instruction').textContent=editable?'每題選「很少、偶爾、總是」其中一項，完成15題再送出。':'老師已提交的選填結果如下。';$('questions').replaceChildren();boot.bank.questions.forEach((text,i)=>{const question=document.createElement('div');question.className='question';const label=document.createElement('div');label.textContent=text;question.append(label);if(editable){const row=document.createElement('div');row.className='choices';['很少','偶爾','總是'].forEach(choice=>{const button=document.createElement('button');button.type='button';button.textContent=choice;button.setAttribute('aria-label','第'+(i+1)+'題：'+choice);button.classList.toggle('selected',answers[i]===choice);button.setAttribute('aria-pressed',String(answers[i]===choice));button.onclick=()=>{if(busy)return;answers[i]=choice;pending=null;row.querySelectorAll('button').forEach(b=>{b.classList.toggle('selected',b.textContent===choice);b.setAttribute('aria-pressed',String(b.textContent===choice))});keep();progress()};row.append(button)});question.append(row)}else{const answer=document.createElement('div');answer.className='answer';answer.textContent='✓ '+(answers[i]||'未選填');question.append(answer)}$('questions').append(question)});$('teacherActions').hidden=!editable;$('progress').hidden=!editable;$('ackPanel').hidden=editable||boot.role!=='admin'&&record.status!=='已閱';$('acknowledged').checked=record.status==='已閱';$('acknowledged').disabled=!(boot.canAcknowledge&&record.status==='已送出');$('ackInfo').textContent=record.status==='已閱'?'已登記：'+record.acknowledgedBy+'｜'+stamp(record.acknowledgedAt):boot.canAcknowledge?'看完後在這裡勾選，系統會自動保存已閱紀錄。':'此表待園長閱覽；只有園長可以勾選已閱。';progress();status(editable?'請逐題選填，可以先暫存再繼續。':record.status==='已閱'?'園長已閱覽，紀錄已保存。':'老師已提交，待園長閱覽。');scrollTo({top:0,behavior:'smooth'})}
async function openRecord(id){if(busy)return;const r=await HeremaySelfEval.call('selfEvalPositiveGet',{id});if(!r.record)throw Error('找不到這份紀錄');showForm(r.record)}
async function task(){if(busy)return;historyMode=false;$('month').value=boot.month;if(boot.role==='admin'){await list();return}if(!boot.opened){$('formPanel').hidden=true;$('listPanel').hidden=true;status('每月2日上午7點開放上個月的正向管教檢核，可先查看歷史紀錄。');return}const id=String(boot.employee.employeeNo)+'_'+boot.month;const r=await HeremaySelfEval.call('selfEvalPositiveGet',{id});showForm(r.record||{id,employeeNo:String(boot.employee.employeeNo),name:boot.employee.name,department:boot.employee.department,month:boot.month,version:boot.bank.version,answers:Array(15).fill(null),status:'草稿',revision:0})}
async function list(){if(busy)return;status('正在讀取紀錄…');$('formPanel').hidden=true;$('listPanel').hidden=false;const data=await HeremaySelfEval.call('selfEvalPositiveList',{month:$('month').value});const merged=new Map(localRecords);data.items.forEach(r=>merged.set(r.id,r));const items=[...merged.values()].filter(r=>(!$('month').value||r.month===$('month').value)&&(! (boot.role==='admin')||r.status!=='草稿')).sort((a,b)=>b.month.localeCompare(a.month)||a.name.localeCompare(b.name));$('records').replaceChildren();items.forEach(r=>{const row=document.createElement('div');row.className='record';const label=document.createElement('div');label.textContent=r.month+'｜'+r.name+'｜'+r.status;const button=document.createElement('button');button.type='button';button.textContent='查看';button.onclick=()=>openRecord(r.id).catch(e=>status(e.message,true));row.append(label,button);$('records').append(row)});if(!items.length)$('records').textContent='尚無紀錄。';$('roster').hidden=boot.role!=='admin'||historyMode;if(!$('roster').hidden){const submitted=e=>items.some(r=>String(r.employeeNo)===String(e.employeeNo)&&r.status!=='草稿');$('roster').textContent='已交：'+boot.roster.filter(submitted).map(e=>e.name).join('、')+'\n未交：'+boot.roster.filter(e=>!submitted(e)).map(e=>e.name).join('、')}status(historyMode?'歷史紀錄依年月排列。':'請點選老師的紀錄查看。')}
async function save(action){if(busy)return;const ack=action==='selfEvalPositiveAcknowledge';if(!ack&&action!=='selfEvalPositiveDraft'&&answers.some(a=>!boot.bank.choices.includes(a))){status('還有題目未選填，請完成15題後送出。',true);return}if(action==='selfEvalPositiveSubmit'&&!confirm('送出後不能修改，確定完成並送出？'))return;busy=true;pending=pending?.action===action?pending:{action,mutationId:crypto.randomUUID()};$('draft').disabled=$('submit').disabled=$('acknowledged').disabled=true;if(!ack)keep();try{status(ack?'正在保存已閱紀錄…':action==='selfEvalPositiveDraft'?'正在暫存…':'正在提交並通知園長…');const r=await HeremaySelfEval.call(action,{payload:{id:record.id,month:record.month,expectedRevision:record.revision||0,mutationId:pending.mutationId,answers:ack?undefined:answers}});if(!ack)localStorage.removeItem(key());pending=null;localRecords.set(r.record.id,r.record);showForm(r.record);status(ack?'已登記園長閱覽，姓名與時間已保存。':action==='selfEvalPositiveDraft'?'已暫存，可以稍後繼續。':'已送出，系統已安排通知園長。')}catch(e){$('acknowledged').checked=record.status==='已閱';status(e.message+(ack?'\n尚未登記已閱，請重試。':'\n填寫內容已保留。'),true)}finally{busy=false;$('draft').disabled=$('submit').disabled=false;$('acknowledged').disabled=!(boot.canAcknowledge&&record.status==='已送出')}}
async function init(){if(busy)return;status('正在讀取…');try{boot=await HeremaySelfEval.call('selfEvalPositiveBootstrap');$('back').onclick=()=>location.href=boot.role==='admin'?'admin.html':boot.employee.homeType==='中階主管首頁'?'leader.html':'teacher.html';$('month').value=boot.month;$('printBook').hidden=boot.role!=='admin';target?await openRecord(target):await task()}catch(e){status(e.message,true)}}
$('printBook').onclick=()=>{if(!busy)location.href='positive_discipline_print.html?v=1.1.0'};
$('current').onclick=()=>task().catch(e=>status(e.message,true));$('history').onclick=()=>{historyMode=true;$('month').value='';list().catch(e=>status(e.message,true))};$('month').onchange=()=>list().catch(e=>status(e.message,true));$('reload').onclick=()=>{if(!busy)(historyMode?list():init()).catch(e=>status(e.message,true))};$('draft').onclick=()=>save('selfEvalPositiveDraft');$('submit').onclick=()=>save('selfEvalPositiveSubmit');$('acknowledged').onchange=()=>{if($('acknowledged').checked)save('selfEvalPositiveAcknowledge')};$('back').onclick=()=>location.href='teacher.html';init();
})();
</script></body></html>
