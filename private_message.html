<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>和美智慧校園｜開啟私訊</title><style>body{margin:0;background:#edf5fc;color:#24364d;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;display:grid;place-items:center;min-height:100vh}.box{text-align:center;font-weight:900;font-size:22px;padding:30px}.small{font-size:15px;color:#738197;margin-top:12px}</style></head><body><div class="box">正在開啟私訊…<div class="small" id="status">確認登入身分與聯絡人名單</div></div><script>
const MESSAGE_URL='https://script.google.com/macros/s/AKfycbwhJsU-5QiZ3uDd9UCnECd16jpHG_LoweHRIC7TrSf_AH-bDLPUFVeAGB2urQo25zzoVg/exec',EMPLOYEE_URL='https://script.google.com/macros/s/AKfycbzbZ6r6c8XjHuKad0U5TIJXr8i141fCBwNJcVsKnoGa1-NXG_JOzapeRF5cVlnGI4F7/exec',params=new URLSearchParams(location.search);let me={};
try{me=JSON.parse(localStorage.getItem('heremay.currentEmployee')||'{}')||{}}catch(e){}
const myName=String(me.name||me['姓名']||'').trim();
function launch(all){const mine=all.find(x=>String(x.name||'').trim()===myName),employeeId=String(mine?.employeeId||me.employeeId||me.id||'').trim();if(!myName||!employeeId){document.getElementById('status').textContent='無法取得登入身分，請回首頁重新登入';return}localStorage.setItem('heremay.private.contacts',JSON.stringify(all));const contacts=btoa(unescape(encodeURIComponent(JSON.stringify(all)))),back=params.get('back')||document.referrer||'https://jack159966-ai.github.io/Heremay-Smart-Campus/';location.replace(MESSAGE_URL+'?view=private&employeeId='+encodeURIComponent(employeeId)+'&name='+encodeURIComponent(myName)+'&contacts='+encodeURIComponent(contacts)+'&back='+encodeURIComponent(back))}
function cached(){try{const all=JSON.parse(localStorage.getItem('heremay.private.contacts')||'[]');if(Array.isArray(all)&&all.length){launch(all);return true}}catch(e){}return false}
window.addEventListener('message',e=>{if(e.data?.type!=='HEREMAY_PRIVATE_CONTACTS_RESULT')return;const all=e.data.payload?.employees||[];if(all.length)launch(all);else document.getElementById('status').textContent='聯絡人名單讀取失敗'});
function requestContacts(){const frame=document.createElement('iframe'),form=document.createElement('form');frame.name='contacts_'+Date.now();frame.style.display='none';form.method='POST';form.action=EMPLOYEE_URL;form.target=frame.name;form.style.display='none';const input=document.createElement('input');input.name='action';input.value='getPrivateMessageContacts';form.appendChild(input);document.body.append(frame,form);form.submit();setTimeout(()=>document.getElementById('status').textContent='聯絡人名單讀取較慢，請返回後再試',20000)}
if(!cached())requestContacts();
</script></body></html>
