<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>和美智慧校園｜私訊 v1.4</title>
<style>
:root{--blue:#4d79b7;--ink:#24364d;--muted:#738197;--line:#d9e4f1;--bg:#edf5fc;--card:#fff;--mine:#dcecff;--quick:#fff3c9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding:14px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{font-size:25px;margin:0;flex:1}.back,.newBtn,.send{border:0;border-radius:14px;background:var(--blue);color:#fff;font-weight:900;padding:11px 14px;font-size:15px}.identity{color:var(--muted);font-weight:800;margin:-5px 0 12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(49,80,120,.09)}.empty,.loading{padding:28px;text-align:center;color:var(--muted);font-weight:800}.thread{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px;display:grid;grid-template-columns:48px 1fr auto;gap:11px;text-align:left;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:#deebfa;display:grid;place-items:center;font-size:20px;font-weight:900;color:#355f98}.thread strong{font-size:18px}.preview{margin-top:4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:360px}.badge{min-width:24px;height:24px;border-radius:12px;background:#df4b4b;color:#fff;display:grid;place-items:center;font-weight:900;padding:0 6px}.contactSheet{display:none}.contactSheet.show{display:block}.sectionTitle{font-size:15px;font-weight:900;color:var(--muted);padding:11px 14px;background:#f5f8fc}.contact{width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:13px 15px;display:flex;justify-content:space-between;text-align:left}.contact strong{font-size:17px}.contact span{color:var(--muted)}.chat{display:none;min-height:calc(100vh - 28px);flex-direction:column}.chat.show{display:flex}.chatHead{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px 12px}.chatHead h2{font-size:20px;margin:0}.messages{flex:1;padding:14px 3px;overflow:auto;min-height:300px}.bubbleRow{display:flex;margin:8px 0}.bubbleRow.mine{justify-content:flex-end}.bubble{max-width:82%;padding:10px 12px;border-radius:17px;background:#fff;border:1px solid var(--line);line-height:1.5;white-space:pre-wrap;word-break:break-word}.mine .bubble{background:var(--mine);border-color:#b9d4f4}.bubble.quick{background:var(--quick);border-color:#ead079;font-weight:900;font-size:17px}.stamp{font-size:11px;color:var(--muted);margin-top:4px;text-align:right}.quickBar{display:flex;gap:7px;overflow-x:auto;padding:9px 1px}.quickBtn{flex:0 0 auto;border:1px solid #e6c65f;border-radius:999px;background:var(--quick);color:#765800;padding:9px 12px;font-weight:900}.composer{background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:44px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:13px;padding:11px;font-size:16px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#20344f;color:#fff;padding:10px 15px;border-radius:999px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body><main class="app">
<section id="inbox">
 <div class="top"><h1>💬 私訊</h1><button class="newBtn" onclick="toggleContacts()">＋開始私訊</button><button class="back" onclick="goBack()">返回</button></div>
 <div class="identity" id="identityText">正在取得登入身分…</div>
 <div id="contactSheet" class="panel contactSheet"><div class="sectionTitle">選擇一位同仁</div><div id="contacts"><div class="loading">正在讀取聯絡人…</div></div></div>
 <div class="panel" id="threads"><div class="loading">正在讀取對話…</div></div>
</section>
<section id="chat" class="chat">
 <div class="chatHead"><button class="back" onclick="closeChat()">‹ 對話</button><div><h2 id="peerName">同仁</h2><div class="identity" id="peerInfo" style="margin:2px 0 0"></div></div></div>
 <div class="messages" id="messages"><div class="loading">正在讀取訊息…</div></div>
 <div class="quickBar" id="quickBar"></div>
 <div class="composer"><textarea id="messageInput" placeholder="輸入訊息…"></textarea><button class="send" onclick="sendTyped()">傳送</button></div>
</section>
</main><div class="toast" id="toast"></div>
<script>
const MESSAGE_URL='https://script.google.com/macros/s/AKfycbwhJsU-5QiZ3uDd9UCnECd16jpHG_LoweHRIC7TrSf_AH-bDLPUFVeAGB2urQo25zzoVg/exec';
const EMPLOYEE_URL='https://script.google.com/macros/s/AKfycbzbZ6r6c8XjHuKad0U5TIJXr8i141fCBwNJcVsKnoGa1-NXG_JOzapeRF5cVlnGI4F7/exec';
const QUICK=['收到','沒問題','謝謝您','處理中','已處理完成','已改善','我會再確認','稍後回覆','對不起，以後會注意'];
const params=new URLSearchParams(location.search);let me={},contacts=[],threads=[],peer=null,threadsLoaded=false;
const pendingPrivateRequests={};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}
function identity(){return{employeeId:String(me.employeeId||me.id||me['員工編號']||'').trim(),name:String(me.name||me['姓名']||'').trim(),account:String(me.account||'').trim()}}
function api(action,extra={}){return new Promise((resolve,reject)=>{const requestId='pm_'+Date.now()+'_'+Math.random().toString(36).slice(2),frame=document.createElement('iframe'),form=document.createElement('form');frame.name=requestId;frame.style.display='none';form.method='POST';form.action=MESSAGE_URL;form.target=requestId;form.style.display='none';const values={...identity(),...extra,action,requestId};Object.entries(values).forEach(([name,value])=>{const input=document.createElement('input');input.name=name;input.value=String(value??'');form.appendChild(input)});document.body.append(frame,form);const timer=setTimeout(()=>finish(new Error('雲端同步較慢')),15000);function finish(err,result){clearTimeout(timer);delete pendingPrivateRequests[requestId];form.remove();frame.remove();if(err)reject(err);else resolve(result)}pendingPrivateRequests[requestId]={finish};form.submit()})}
function loadMe(){try{me=JSON.parse(localStorage.getItem('heremay.currentEmployee')||'{}')||{}}catch(e){}const id=identity();document.getElementById('identityText').textContent=id.name?id.name+' 的私訊':'尚未取得登入身分';return !!id.name}
function requestContacts(){const frame=document.createElement('iframe');frame.name='pm_contacts_'+Date.now();frame.style.display='none';document.body.appendChild(frame);const form=document.createElement('form');form.method='POST';form.action=EMPLOYEE_URL;form.target=frame.name;form.style.display='none';const input=document.createElement('input');input.name='action';input.value='getPrivateMessageContacts';form.appendChild(input);document.body.appendChild(form);form.submit();setTimeout(()=>{form.remove();frame.remove()},15000)}
window.addEventListener('message',e=>{if(e.data?.type==='HEREMAY_PRIVATE_API_RESULT'){const payload=e.data.payload||{},pending=pendingPrivateRequests[payload.requestId];if(!pending)return;const result=payload.result||{};result.ok?pending.finish(null,result):pending.finish(new Error(result.error||'操作失敗'));return}if(e.data?.type!=='HEREMAY_PRIVATE_CONTACTS_RESULT')return;const r=e.data.payload||{},all=r.employees||[];resolveMyId(all);contacts=all.filter(x=>String(x.employeeId)!==identity().employeeId);localStorage.setItem('heremay.private.contacts',JSON.stringify(all));renderContacts();if(!threadsLoaded&&identity().employeeId){threadsLoaded=true;loadThreads()}const wanted=params.get('peerId');if(wanted&&!peer){const c=contacts.find(x=>String(x.employeeId)===wanted);if(c)openChat(c)}});
function resolveMyId(all){if(identity().employeeId)return;const mine=all.find(x=>String(x.name||'').trim()===identity().name);if(mine)me.employeeId=mine.employeeId}
function loadCachedContacts(){try{const all=JSON.parse(localStorage.getItem('heremay.private.contacts')||'[]');if(!Array.isArray(all)||!all.length)return false;resolveMyId(all);contacts=all.filter(x=>String(x.employeeId)!==identity().employeeId);renderContacts();if(identity().employeeId){threadsLoaded=true;loadThreads()}return true}catch(e){return false}}
function renderContacts(){const b=document.getElementById('contacts');b.innerHTML=contacts.length?contacts.sort((a,b)=>String(a.group).localeCompare(String(b.group),'zh-Hant')||String(a.name).localeCompare(String(b.name),'zh-Hant')).map((x,i)=>`<button class="contact" onclick="openContact(${i})"><strong>${esc(x.name)}</strong><span>${esc([x.group,x.jobTitle,x.classGroup].filter(Boolean).join('｜'))}</span></button>`).join(''):'<div class="empty">目前沒有可聯絡同仁</div>'}
function toggleContacts(){document.getElementById('contactSheet').classList.toggle('show')}
function openContact(i){openChat(contacts[i])}
function renderThreads(){document.getElementById('threads').innerHTML=threads.length?threads.map((x,i)=>`<button class="thread" onclick="openThread(${i})"><span class="avatar">${esc((x.peerName||'?').slice(0,1))}</span><span><strong>${esc(x.peerName)}</strong><div class="preview">${esc(x.lastMessage||'附件')}</div></span>${Number(x.unread)?`<span class="badge">${Number(x.unread)}</span>`:'<span></span>'}</button>`).join(''):'<div class="empty">目前沒有私訊<br>點選「開始私訊」選擇同仁</div>'}
function loadCachedThreads(){try{threads=JSON.parse(localStorage.getItem('heremay.private.threads')||'[]');if(!Array.isArray(threads))threads=[]}catch(e){threads=[]}renderThreads()}
async function loadThreads(){try{const r=await api('listPrivateThreads');threads=r.threads||[];localStorage.setItem('heremay.private.threads',JSON.stringify(threads));renderThreads()}catch(e){console.warn('私訊背景同步：',e.message);toast('雲端同步較慢，已顯示手機暫存內容')}}
function openThread(i){const t=threads[i],c=contacts.find(x=>String(x.employeeId)===String(t.peerId));openChat(c||{employeeId:t.peerId,name:t.peerName})}
async function openChat(x){peer=x;document.getElementById('inbox').style.display='none';document.getElementById('chat').classList.add('show');document.getElementById('peerName').textContent=x.name;document.getElementById('peerInfo').textContent=[x.group,x.jobTitle,x.classGroup].filter(Boolean).join('｜');await loadMessages()}
async function loadMessages(){if(!peer)return;try{const r=await api('listPrivateMessages',{peerId:peer.employeeId});renderMessages(r.items||[]);await api('markPrivateRead',{peerId:peer.employeeId})}catch(e){document.getElementById('messages').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function renderMessages(items){const id=identity().employeeId,b=document.getElementById('messages');b.innerHTML=items.length?items.map(x=>{const mine=String(x.senderId)===id;return`<div class="bubbleRow ${mine?'mine':''}"><div class="bubble ${x.messageType==='快捷回覆'?'quick':''}">${esc(x.isRecalled?'訊息已收回':x.message)}<div class="stamp">${esc(x.createdAt)}${mine&&x.isRead?'・已讀':''}</div></div></div>`}).join(''):'<div class="empty">開始第一則對話吧</div>';b.scrollTop=b.scrollHeight}
async function sendMessage(text,quick=false){text=String(text||'').trim();if(!text||!peer)return;try{await api('sendPrivateMessage',{senderId:identity().employeeId,senderName:identity().name,receiverId:peer.employeeId,receiverName:peer.name,message:text,messageType:quick?'快捷回覆':'文字',quickReply:quick?'yes':''});document.getElementById('messageInput').value='';await loadMessages()}catch(e){toast(e.message)}}
function sendTyped(){sendMessage(document.getElementById('messageInput').value,false)}
function closeChat(){peer=null;document.getElementById('chat').classList.remove('show');document.getElementById('inbox').style.display='';loadThreads()}
function goBack(){if(params.get('back'))location.href=params.get('back');else if(history.length>1)history.back();else location.href='teacher.html'}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
document.getElementById('quickBar').innerHTML=QUICK.map(x=>`<button class="quickBtn" onclick="sendMessage('${x.replace(/'/g,"\\'")}',true)">${esc(x)}</button>`).join('');
if(loadMe()){loadCachedThreads();const cached=loadCachedContacts();if(!cached)document.getElementById('contacts').innerHTML='<div class="loading">首次建立聯絡人名單，請稍候…</div>';requestContacts()}else document.getElementById('threads').innerHTML='<div class="empty">請由校園首頁重新登入</div>';
</script></body></html>
