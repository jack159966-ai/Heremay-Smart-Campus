<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>和美智慧校園｜私訊 v3.2</title>
<style>
:root{--blue:#587fbb;--ink:#24364d;--muted:#78859a;--line:#d8e3f0;--bg:#edf5fc;--mine:#dcecff;--quick:#fff3c9;--danger:#bd3d3d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}button,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100dvh;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(18px + env(safe-area-inset-bottom,0px))}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.top h1{font-size:30px;margin:0;flex:1}.btn{border:0;border-radius:16px;background:var(--blue);color:#fff;font-weight:900;padding:13px 16px;font-size:17px}.identity{color:var(--muted);font-size:18px;font-weight:900;margin:0 0 14px}.panel,.chatHead,.composer{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}.empty,.loading{padding:34px 18px;text-align:center;color:var(--muted);font-size:18px;font-weight:900;line-height:1.55}.thread{width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:16px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;text-align:left;align-items:center}.thread:last-child{border-bottom:0}.avatar{width:52px;height:52px;border-radius:50%;background:#deebfa;display:grid;place-items:center;font-size:22px;font-weight:900;color:#355f98}.thread strong,.contact strong{font-size:19px}.preview{margin-top:4px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:390px}.badge{min-width:27px;height:27px;border-radius:14px;background:#df4b4b;color:#fff;display:grid;place-items:center;font-weight:900;padding:0 8px}.contacts{display:none;margin-bottom:12px}.contacts.show{display:block}.sectionTitle{font-size:17px;font-weight:900;color:var(--muted);padding:13px 16px;background:#f5f8fc}.contact{width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:15px 16px;display:flex;justify-content:space-between;gap:12px;text-align:left}.contact span{color:var(--muted);text-align:right}.chat{display:none;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px) - 46px);flex-direction:column}.chat.show{display:flex}.chatHead{display:flex;align-items:center;gap:12px;padding:12px 14px;flex:0 0 auto}.chatHead h2{font-size:23px;margin:0}.chatHead .identity{font-size:15px;margin:3px 0 0}.messages{flex:1;padding:14px 4px;overflow:auto;min-height:180px}.bubbleRow{display:flex;margin:10px 0}.bubbleRow.mine{justify-content:flex-end}.bubble{max-width:84%;padding:12px 14px;border-radius:19px;background:#fff;border:1px solid var(--line);font-size:17px;line-height:1.5;white-space:pre-wrap;word-break:break-word}.mine .bubble{background:var(--mine);border-color:#b9d4f4}.bubble.quick{background:var(--quick);border-color:#ead079;font-weight:900}.stamp{font-size:12px;color:var(--muted);margin-top:5px;text-align:right}.pending{opacity:.65}.failed{border-color:#df7373!important}.failed .stamp{color:var(--danger);font-weight:900}.quickBar{display:flex;gap:8px;overflow-x:auto;padding:9px 2px;flex:0 0 auto}.quickBtn{flex:0 0 auto;border:1px solid #e6c65f;border-radius:999px;background:var(--quick);color:#765800;padding:10px 14px;font-weight:900}.composer{padding:10px;display:flex;gap:9px;align-items:flex-end;flex:0 0 auto}.composer textarea{flex:1;min-height:52px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:15px;padding:13px;font-size:17px}.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:88%;background:#20344f;color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;z-index:20}.toast.show{opacity:1}button:disabled{opacity:.55}@media(max-width:520px){.app{padding-left:12px;padding-right:12px}.top h1{font-size:27px}.top .btn{padding:12px 13px}.contact{display:block}.contact span{display:block;text-align:left;margin-top:4px}.preview{max-width:210px}}
</style></head><body><main class="app"><section id="inbox"><div class="top"><h1>💬 私訊</h1><button class="btn" id="newBtn">＋開始私訊</button><button class="btn" id="backBtn">返回</button></div><div class="identity" id="identityText"></div><div id="contactSheet" class="panel contacts"><div class="sectionTitle">選擇一位同仁</div><div id="contacts"></div></div><div class="panel" id="threads"><div class="loading">正在讀取對話…</div></div></section><section id="chat" class="chat"><div class="chatHead"><button class="btn" id="closeBtn">‹ 對話</button><div><h2 id="peerName"></h2><div class="identity" id="peerInfo"></div></div></div><div class="messages" id="messages"></div><div class="quickBar" id="quickBar"></div><div class="composer"><textarea id="messageInput" placeholder="輸入訊息…"></textarea><button class="btn" id="sendBtn">傳送</button></div></section></main><div class="toast" id="toast"></div>
<script>
const API='https://heremay-passkey-backend-943533867342.asia-east1.run.app',QUICK=['收到','沒問題','謝謝您','處理中','已處理完成','已改善','我會再確認','稍後回覆','對不起，以後會注意'],params=new URLSearchParams(location.search);let raw={};try{raw=JSON.parse(localStorage.getItem('heremay.currentEmployee')||'{}')||{}}catch(_){}const me={employeeId:String(raw.employeeId||raw.employeeNo||raw.id||raw['員工編號']||'').trim(),name:String(raw.name||raw['姓名']||'').trim()};let contacts=[],threads=[],peer=null,messages=[],sending=false,messageRevision=0;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s])),personKey=x=>`${String(x.employeeId||x.employeeNo||'').trim().toLowerCase()}::${String(x.name||'').trim().toLowerCase()}`,cacheKey=s=>`heremay.private.v3.${personKey(me)}.${s}`;
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2400)}function readCache(k){try{return JSON.parse(localStorage.getItem(k)||'[]')||[]}catch(_){return[]}}function saveCache(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}function formatTime(ms){const d=new Date(Number(ms||0));return Number(ms)&&!isNaN(d)?new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}).format(d):''}
async function api(path,{method='GET',body,query}={}){const url=new URL(API+path);Object.entries(query||{}).forEach(([k,v])=>url.searchParams.set(k,v));const c=new AbortController(),timer=setTimeout(()=>c.abort(),40000);try{const r=await fetch(url,{method,headers:body?{'Content-Type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,signal:c.signal,cache:'no-store'}),data=await r.json().catch(()=>({}));if(!r.ok||!data.ok)throw new Error(data.message||`連線失敗（${r.status}）`);return data}catch(e){if(e.name==='AbortError')throw new Error('雲端連線逾時，請稍後再試');throw e}finally{clearTimeout(timer)}}
function renderContacts(){const b=$('contacts');b.innerHTML=contacts.length?contacts.map((x,i)=>`<button class="contact" data-contact="${i}"><strong>${esc(x.name)}</strong><span>${esc([x.department,x.title,x.classCode].filter(Boolean).join('｜'))}</span></button>`).join(''):'<div class="empty">目前沒有可聯絡同仁</div>';b.querySelectorAll('[data-contact]').forEach(x=>x.onclick=()=>openChat(contacts[+x.dataset.contact]))}
function renderThreads(){const b=$('threads');b.innerHTML=threads.length?threads.map((x,i)=>`<button class="thread" data-thread="${i}"><span class="avatar">${esc((x.peerName||'?').slice(0,1))}</span><span><strong>${esc(x.peerName)}</strong><div class="preview">${esc(x.lastMessage||'訊息')}</div></span>${+x.unread?`<span class="badge">${Math.min(99,+x.unread)}</span>`:'<span></span>'}</button>`).join(''):'<div class="empty">目前沒有私訊<br>點選「開始私訊」選擇同仁</div>';b.querySelectorAll('[data-thread]').forEach(x=>x.onclick=()=>{const t=threads[+x.dataset.thread],c=contacts.find(y=>personKey(y)===personKey({employeeId:t.peerId,name:t.peerName}));openChat(c||{employeeId:t.peerId,name:t.peerName})})}
async function loadContacts(){contacts=readCache(cacheKey('contacts'));if(contacts.length)renderContacts();try{const r=await api('/api/private/contacts',{query:{employeeId:me.employeeId,name:me.name}});contacts=r.items||[];saveCache(cacheKey('contacts'),contacts);renderContacts()}catch(e){if(!contacts.length)$('contacts').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}
async function loadThreads(silent=false){if(!silent){threads=readCache(cacheKey('threads'));if(threads.length)renderThreads()}try{const r=await api('/api/private/threads',{query:{employeeId:me.employeeId,name:me.name}});threads=r.items||[];saveCache(cacheKey('threads'),threads);renderThreads()}catch(e){if(!threads.length)$('threads').innerHTML=`<div class="empty">${esc(e.message)}</div>`;else if(!silent)toast(e.message)}}
function renderMessages(){const b=$('messages');b.innerHTML=messages.length?messages.map(x=>{const mine=personKey({employeeId:x.senderId,name:x.senderName})===personKey(me),state=x._failed?'failed':x._pending?'pending':'';return`<div class="bubbleRow ${mine?'mine':''}"><div class="bubble ${x.messageType==='quick'?'quick':''} ${state}">${esc(x.message)}<div class="stamp">${x._failed?'傳送失敗':x._pending?'傳送中…':formatTime(x.createdAt)+(mine&&x.readAt?'・已讀':'')}</div></div></div>`}).join(''):'<div class="empty">開始第一則對話吧</div>';b.scrollTop=b.scrollHeight}
async function openChat(x){peer=x;const key=personKey(peer);threads=threads.map(t=>personKey({employeeId:t.peerId,name:t.peerName})===key?{...t,unread:0}:t);saveCache(cacheKey('threads'),threads);renderThreads();$('inbox').style.display='none';$('chat').classList.add('show');$('peerName').textContent=x.name;$('peerInfo').textContent=[x.department,x.title,x.classCode].filter(Boolean).join('｜');messages=readCache(cacheKey('messages.'+key));if(messages.length)renderMessages();else $('messages').innerHTML='<div class="loading">正在讀取訊息…</div>';api('/api/private/read',{method:'POST',body:{employeeId:me.employeeId,name:me.name,peerId:peer.employeeId,peerName:peer.name}}).then(()=>loadThreads(true)).catch(()=>{});await loadMessages()}
async function loadMessages(silent=false){if(!peer||sending)return;const revision=messageRevision,currentPeer=personKey(peer);try{const pending=messages.filter(x=>x._pending||x._failed),r=await api('/api/private/messages',{query:{employeeId:me.employeeId,name:me.name,peerId:peer.employeeId,peerName:peer.name}});if(revision!==messageRevision||!peer||currentPeer!==personKey(peer))return;const cloud=r.items||[],cloudIds=new Set(cloud.map(x=>x.id));messages=[...cloud,...pending.filter(x=>!cloudIds.has(x.id))].sort((a,b)=>a.createdAt-b.createdAt);saveCache(cacheKey('messages.'+personKey(peer)),cloud);renderMessages()}catch(e){if(revision!==messageRevision)return;if(!messages.length)$('messages').innerHTML=`<div class="empty">${esc(e.message)}</div>`;else if(!silent)toast(e.message)}}
function setSending(v){sending=v;$('sendBtn').disabled=v;document.querySelectorAll('.quickBtn').forEach(b=>b.disabled=v)}async function sendMessage(text,quick=false){text=String(text||'').trim();if(!text||!peer||sending)return;messageRevision++;setSending(true);$('messageInput').value='';const pending={id:'pending-'+Date.now(),createdAt:Date.now(),senderId:me.employeeId,senderName:me.name,receiverId:peer.employeeId,receiverName:peer.name,messageType:quick?'quick':'text',message:text,readAt:0,_pending:true};messages.push(pending);renderMessages();try{const r=await api('/api/private/messages',{method:'POST',body:{senderId:me.employeeId,senderName:me.name,receiverId:peer.employeeId,receiverName:peer.name,message:text,quickReply:quick}});messages=messages.filter(x=>x.id!==pending.id);messages.push(r.item);messages.sort((a,b)=>a.createdAt-b.createdAt);saveCache(cacheKey('messages.'+personKey(peer)),messages);renderMessages();loadThreads(true)}catch(e){pending._pending=false;pending._failed=true;renderMessages();toast(e.message)}finally{setSending(false)}}
function closeChat(){peer=null;$('chat').classList.remove('show');$('inbox').style.display='';loadThreads(true)}function goBack(){const back=params.get('back');if(back)return location.href=back;if(history.length>1)return history.back();location.href='index.html'}
$('identityText').textContent=(me.name||'尚未登入')+' 的私訊';$('newBtn').onclick=()=>$('contactSheet').classList.toggle('show');$('backBtn').onclick=goBack;$('closeBtn').onclick=closeChat;$('sendBtn').onclick=()=>sendMessage($('messageInput').value);$('messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage(e.currentTarget.value)}};$('quickBar').innerHTML=QUICK.map((x,i)=>`<button class="quickBtn" data-quick="${i}">${esc(x)}</button>`).join('');$('quickBar').querySelectorAll('[data-quick]').forEach(x=>x.onclick=()=>sendMessage(QUICK[+x.dataset.quick],true));if(!me.employeeId||!me.name){$('threads').innerHTML='<div class="empty">無法取得登入身分<br>請返回首頁重新登入</div>';$('newBtn').disabled=true}else{loadContacts();loadThreads();setInterval(()=>{if(document.visibilityState==='visible')peer?loadMessages(true):loadThreads(true)},10000)}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')peer?loadMessages(true):loadThreads(true)});
</script></body></html>
