<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>排班中心連線診斷</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft JhengHei",sans-serif;background:#eef7fb;margin:0;padding:24px;color:#183b56}
.card{max-width:900px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{margin-top:0}
.step{padding:12px 14px;margin:10px 0;border-radius:12px;background:#f3f6f8}
.ok{background:#eaf7f0;color:#236b49}
.err{background:#fff0f0;color:#a33}
.wait{background:#fff8e6;color:#8a6500}
pre{white-space:pre-wrap;word-break:break-all;background:#102a43;color:white;padding:14px;border-radius:12px;max-height:360px;overflow:auto}
.small{color:#58748a;font-size:14px}
button{padding:10px 16px;border:0;border-radius:10px;background:#2f86b4;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>排班中心連線診斷 v1</h1>
<p class="small">這頁只測試 Apps Script 連線，不會寫入任何 Google Sheet。</p>

<div id="s1" class="step">① JavaScript 尚未啟動</div>
<div id="s2" class="step">② 尚未送出請求</div>
<div id="s3" class="step">③ 尚未確認 script 載入</div>
<div id="s4" class="step">④ 尚未收到 callback</div>
<div id="s5" class="step">⑤ 尚未驗證資料</div>

<p><button onclick="runTest()">重新測試</button></p>
<pre id="log">等待測試…</pre>
</div>

<script>
const API='https://script.google.com/macros/s/AKfycbw-vNSfGNciRGnEC3rNTHk0qnZzZSD0m17WrhISxN2HD_YvO3JscLPdQPLcgr2fFYrz/exec';

function setStep(id,text,cls){
  const el=document.getElementById(id);
  el.textContent=text;
  el.className='step '+(cls||'');
}
function log(msg){
  const el=document.getElementById('log');
  el.textContent += '\n'+msg;
}
function runTest(){
  document.getElementById('log').textContent='開始診斷…';
  setStep('s1','① JavaScript 已啟動','ok');
  setStep('s2','② 準備送出請求','wait');
  setStep('s3','③ 等待 script 載入','wait');
  setStep('s4','④ 等待 callback','wait');
  setStep('s5','⑤ 等待資料驗證','wait');

  const callbackName='diagCallback_'+Date.now();
  let callbackReceived=false;

  window[callbackName]=function(data){
    callbackReceived=true;
    setStep('s4','④ callback 已收到資料','ok');

    try{
      log('callback data: '+JSON.stringify(data));

      if(data && data.ok===true){
        setStep(
          's5',
          '⑤ 資料正常：peopleCount='+data.peopleCount+'，typeCount='+data.typeCount+'，version='+data.version,
          'ok'
        );
      }else{
        setStep('s5','⑤ callback 有回來，但資料格式異常','err');
      }
    }catch(e){
      setStep('s5','⑤ 處理 callback 資料時發生錯誤：'+e.message,'err');
    }
  };

  const old=document.getElementById('diagScript');
  if(old) old.remove();

  const s=document.createElement('script');
  s.id='diagScript';
  s.src=API+'?action=bootstrap&callback='+encodeURIComponent(callbackName)+'&t='+Date.now();

  log('request url: '+s.src);

  s.onload=function(){
    setStep('s3','③ script 標籤已完成載入','ok');
    log('script.onload fired');
  };

  s.onerror=function(e){
    setStep('s3','③ script 載入失敗','err');
    log('script.onerror fired');
  };

  document.head.appendChild(s);
  setStep('s2','② 請求已送出','ok');

  setTimeout(function(){
    if(!callbackReceived){
      setStep('s4','④ 12 秒內沒有收到 callback','err');
      log('timeout: callback not received');
    }
  },12000);
}

window.addEventListener('error',function(e){
  log('window error: '+e.message+' @ '+e.filename+':'+e.lineno);
});

runTest();
</script>
</body>
</html>
