<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>和美智慧校園｜我的班表</title>
<style>
:root{
  --pink:#df5b89;--deep:#6d2944;--line:#efbfd0;--soft:#fff3f8;
  --text:#3e3036;--muted:#8c6c78;--ok:#2f7c62;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:"Microsoft JhengHei",Arial,sans-serif;
  background:linear-gradient(#fff8fb,#fdebf3);color:var(--text)
}
.app{width:min(980px,100%);margin:auto;padding:18px 16px 48px}
.head{
  background:#fff;border:2px solid var(--line);border-radius:26px;padding:20px;
  display:flex;align-items:center;gap:14px;box-shadow:0 10px 28px #aa526a18
}
.head .icon{font-size:42px}
.head h1{margin:0;color:var(--deep);font-size:27px}
.head p{margin:5px 0 0;color:var(--muted);font-weight:700}
.back{
  margin-left:auto;border:0;border-radius:999px;background:var(--pink);
  color:#fff;padding:10px 16px;font-weight:900;cursor:pointer
}
.userCard,.statusBox{
  margin-top:14px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:14px 16px
}
.userCard{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.userName{font-size:20px;font-weight:900;color:var(--deep)}
.userMeta{color:var(--muted);font-weight:700}
.statusBox{color:var(--muted);font-weight:800}
.tabs{display:flex;gap:8px;overflow:auto;padding:18px 2px 8px}
.tab{
  white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--deep);
  border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer
}
.tab.active{background:var(--pink);color:#fff;border-color:var(--pink)}
.scheduleCard{
  margin-top:12px;background:#fff;border:2px solid var(--line);
  border-radius:24px;padding:18px
}
.scheduleTitle{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.scheduleTitle h2{margin:0;color:var(--deep);font-size:22px}
.publishMeta{
  margin-top:6px;font-size:17px;font-weight:900;color:var(--deep)
}
.version{font-size:11px;font-weight:700;color:#a7a0a4;margin-left:6px}
.semester{font-size:13px;color:var(--muted);font-weight:800}
.rows{display:grid;gap:10px;margin-top:14px}
.row{
  display:grid;grid-template-columns:150px 1fr 130px;gap:12px;align-items:center;
  background:var(--soft);border:1px solid #f5d5e1;border-radius:16px;padding:13px 14px
}
.week{font-weight:900;color:var(--deep)}
.job strong{font-size:17px;color:var(--deep)}
.job small{display:block;color:var(--muted);font-weight:800;margin-top:3px}
.badge{
  justify-self:end;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 10px;font-size:12px;font-weight:900;color:var(--pink)
}
.empty{
  margin-top:18px;background:#fff;border:2px dashed var(--line);border-radius:22px;
  padding:34px 18px;text-align:center;color:var(--muted);font-weight:900
}
.footer{text-align:center;color:#9c7785;font-size:13px;font-weight:700;margin-top:18px}
@media(max-width:620px){
  .app{padding:12px 10px 38px}.head{padding:16px;border-radius:22px}
  .head h1{font-size:22px}.head .icon{font-size:34px}.back{padding:9px 12px}
  .row{grid-template-columns:1fr}.badge{justify-self:start}
}
</style>
</head>
<body>
<main class="app">
<header class="head">
  <div class="icon">🗓️</div>
  <div><h1>我的班表</h1><p>顯示本部門目前有效的正式發布班表，方便同仁協調換班</p></div>
  <button class="back" onclick="history.back()">返回</button>
</header>

<div class="userCard">
  <div class="userName" id="userName">讀取中…</div>
  <div class="userMeta" id="userMeta"></div>
</div>

<div class="statusBox" id="cloudStatus">正在讀取正式班表…</div>
<nav class="tabs" id="tabs"></nav>
<section id="content"></section>
<div class="footer">和美智慧校園｜正式班表以最新發布日期為準</div>
</main>

<script>
const SCHEDULE_API='https://script.google.com/macros/s/AKfycbw-vNSfGNciRGnEC3rNTHk0qnZzZSD0m17WrhISxN2HD_YvO3JscLPdQPLcgr2fFYrz/exec';

let currentEmployee=null;
let currentRole='';
let publishedRows=[];
let activeCode='';

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function normalizeClass(v){
  let s=String(v||'').trim();
  if(!s)return '';
  if(s.endsWith('班'))return s;
  if(/^[A-Za-z]\d+$/.test(s))return s+'班';
  return s;
}

function loadCurrentEmployee(){
  try{
    const raw=localStorage.getItem('heremay.currentEmployee');
    currentEmployee=raw?JSON.parse(raw):null;
    currentRole=String(localStorage.getItem('heremay.currentRole')||'').trim().toLowerCase();
  }catch(_){
    currentEmployee=null;
    currentRole='';
  }

  if(!currentEmployee || !currentEmployee.name){
    userName.textContent='尚未取得登入人員';
    userMeta.textContent='';
    cloudStatus.textContent='請先從和美智慧校園首頁登入後，再開啟班表。';
    return false;
  }

  if(currentRole==='admin'){
    const title=document.querySelector('.head h1');
    const desc=document.querySelector('.head p');
    if(title)title.textContent='全校班表';
    if(desc)desc.textContent='顯示園方目前有效的全部正式發布班表';
  }

  const name=String(currentEmployee.name||'').trim();
  const cls=normalizeClass(
    currentEmployee.className ||
    currentEmployee.class ||
    currentEmployee.shift ||
    currentEmployee.group ||
    ''
  );
  const dept=String(
    currentEmployee.department ||
    currentEmployee.group ||
    ''
  ).trim();
  const job=String(currentEmployee.jobTitle||'').trim();

  userName.textContent=name;
  userMeta.textContent=currentRole==='admin'
    ? ['主管','全校檢視',job].filter(Boolean).join('｜')
    : [dept,cls,job].filter(Boolean).join('｜');
  return true;
}

function requestPublished(){
  if(!loadCurrentEmployee())return;

  const old=document.getElementById('publishedJsonp');
  if(old)old.remove();

  const name=String(currentEmployee.name||'').trim();
  const cls=normalizeClass(
    currentEmployee.className ||
    currentEmployee.class ||
    currentEmployee.shift ||
    currentEmployee.group ||
    ''
  );
  const dept=String(currentEmployee.department||'').trim();

  const s=document.createElement('script');
  s.id='publishedJsonp';
  s.src=SCHEDULE_API+
    '?action=publishedForUser'+
    '&name='+encodeURIComponent(name)+
    '&className='+encodeURIComponent(cls)+
    '&department='+encodeURIComponent(dept)+
    '&role='+encodeURIComponent(currentRole)+
    '&callback=receivePublished'+
    '&t='+Date.now();

  s.onerror=function(){
    cloudStatus.textContent='正式班表連線失敗，請稍後再試。';
  };
  document.head.appendChild(s);
}

function receivePublished(data){
  const old=document.getElementById('publishedJsonp');
  if(old)old.remove();

  if(!data || data.ok!==true){
    cloudStatus.textContent=(data&&data.message)?data.message:'讀取正式班表失敗';
    return;
  }

  publishedRows=Array.isArray(data.rows)?data.rows:[];

  if(data.user){
    const name=String(data.user.name||currentEmployee.name||'').trim();
    const dept=String(data.user.department||'').trim();
    const cls=normalizeClass(data.user.className||'');
    const job=String((currentEmployee&&currentEmployee.jobTitle)||'').trim();

    userName.textContent=name;
    userMeta.textContent=currentRole==='admin'
      ? ['主管','全校檢視',job].filter(Boolean).join('｜')
      : [dept,cls,job].filter(Boolean).join('｜');
  }

  cloudStatus.textContent=publishedRows.length
    ? '已同步最新正式班表'
    : '目前沒有園方正式發布的班表。';

  render();
}
window.receivePublished=receivePublished;

function groupBySchedule(){
  const map={};
  publishedRows.forEach(r=>{
    const groupCode=String(r.publishGroup||r.code||'');
    const key=[r.semester,groupCode].join('__');
    if(!map[key]){
      map[key]={
        key:key,
        semester:r.semester,
        code:groupCode,
        name:r.scheduleName,
        publishedAt:r.publishedAt,
        version:r.publishVersion,
        rows:[]
      };
    }
    map[key].rows.push(r);
  });
  return Object.values(map);
}

function render(){
  const groups=groupBySchedule();

  if(!groups.length){
    tabs.innerHTML='';
    content.innerHTML='<div class="empty">目前沒有園方正式發布的班表。<br>若主管剛撤回更新，重新發布後會自動出現。</div>';
    return;
  }

  if(!activeCode || !groups.some(g=>g.key===activeCode)){
    activeCode=groups[0].key;
  }

  tabs.innerHTML=groups.map(g=>
    '<button class="tab '+(g.key===activeCode?'active':'')+
    '" onclick="activeCode=\''+esc(g.key)+'\';render()">'+esc(g.name)+'</button>'
  ).join('');

  const g=groups.find(x=>x.key===activeCode)||groups[0];

  let bodyHtml='';

  if(g.code==='KINDER_EARLY_LATE'){
    const weekMap={};
    g.rows.forEach(r=>{
      const key=r.weekStart;
      if(!weekMap[key]){
        weekMap[key]={
          weekStart:r.weekStart,
          weekEnd:r.weekEnd,
          weekLabel:r.weekLabel,
          early:{A:'',B:'',AB:''},
          late:{A:'',B:'',AB:''}
        };
      }
      const target=r.code==='KINDER_LATE' ? weekMap[key].late : weekMap[key].early;
      target[r.position]=r.assigned||'';
    });

    bodyHtml='<div class="rows">'+Object.values(weekMap).map(w=>
      '<div class="row" style="grid-template-columns:140px 1fr">'+
        '<div class="week">'+esc(w.weekLabel||((w.weekStart||'')+'－'+(w.weekEnd||'')))+'</div>'+
        '<div class="job">'+
          '<strong>早值</strong><small>'+
            'A：'+esc(w.early.A||'—')+'　B：'+esc(w.early.B||'—')+'　AB：'+esc(w.early.AB||'—')+
          '</small>'+
          '<strong style="display:block;margin-top:8px">晚值</strong><small>'+
            'A：'+esc(w.late.A||'—')+'　B：'+esc(w.late.B||'—')+'　AB：'+esc(w.late.AB||'—')+
          '</small>'+
        '</div>'+
      '</div>'
    ).join('')+'</div>';
  }else{
    bodyHtml=
      '<div class="rows">'+
        g.rows.map(r=>
          '<div class="row">'+
            '<div class="week">'+esc(r.weekLabel || ((r.weekStart||'')+'－'+(r.weekEnd||'')))+'</div>'+
            '<div class="job"><strong>'+esc(r.scheduleName)+'</strong>'+
              '<small>'+esc([r.position,r.className].filter(Boolean).join('｜'))+'</small></div>'+
            '<div class="badge">'+esc(r.assigned||'輪值')+'</div>'+
          '</div>'
        ).join('')+
      '</div>';
  }

  content.innerHTML=
    '<article class="scheduleCard">'+
      '<div class="scheduleTitle">'+
        '<div><h2>'+esc(g.name)+'</h2>'+
          '<div class="publishMeta">發布日期：'+esc(g.publishedAt)+
          '<span class="version">v'+esc(g.version)+'</span></div>'+
        '</div>'+
        '<div class="semester">'+esc(g.semester)+'</div>'+
      '</div>'+
      bodyHtml+
    '</article>';
}

requestPublished();
</script>
</body>
</html>
