<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>和美智慧校園｜排班表</title>
  <style>
    :root{--pink:#df5b89;--deep:#6d2944;--line:#efbfd0;--soft:#fff3f8;--text:#3e3036}
    *{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:linear-gradient(#fff8fb,#fdebf3);color:var(--text)}
    .app{width:min(920px,100%);margin:auto;padding:18px 16px 48px}.head{background:#fff;border:2px solid var(--line);border-radius:26px;padding:20px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 28px #aa526a18}
    .head .icon{font-size:42px}.head h1{margin:0;color:var(--deep);font-size:27px}.head p{margin:5px 0 0;color:#8c6c78;font-weight:700}.back{margin-left:auto;border:0;border-radius:999px;background:var(--pink);color:#fff;padding:10px 16px;font-weight:900;cursor:pointer}
    .tabs{display:flex;gap:8px;overflow:auto;padding:18px 2px 8px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--deep);border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.tab.active{background:var(--pink);color:#fff;border-color:var(--pink)}
    .notice{margin:12px 0;background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px 16px;color:#7a5a67;font-weight:700}.weeks{display:grid;gap:14px}.week{background:#fff;border:2px solid var(--line);border-radius:24px;padding:18px}.week.current{border-color:var(--pink);box-shadow:0 10px 28px #c44d7620}.week h2{margin:0 0 14px;color:var(--deep);display:flex;justify-content:space-between;align-items:center;font-size:21px}.badge{font-size:13px;background:var(--soft);color:var(--pink);border-radius:999px;padding:6px 10px}.rows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.duty{background:var(--soft);border:1px solid #f5d5e1;border-radius:16px;padding:14px;text-align:center}.duty small{display:block;color:#9a7180;font-weight:800;margin-bottom:5px}.duty strong{font-size:19px;color:var(--deep)}
    .empty{padding:28px;text-align:center;color:#947480;font-weight:800}.footer{text-align:center;color:#9c7785;font-size:13px;font-weight:700;margin-top:18px}
    @media(max-width:560px){.app{padding:12px 10px 38px}.head{padding:16px;border-radius:22px}.head h1{font-size:22px}.head p{font-size:13px}.head .icon{font-size:34px}.back{padding:9px 12px}.week{padding:15px}.rows{grid-template-columns:1fr}.duty{display:flex;justify-content:space-between;align-items:center;text-align:left}.duty small{margin:0}.duty strong{font-size:18px}}
  </style>
</head>
<body><main class="app">
  <header class="head"><div class="icon">🗓️</div><div><h1>排班表</h1><p>本週與未來兩週</p></div><button class="back" onclick="history.back()">返回</button></header>
  <nav class="tabs" id="tabs"></nav><div class="notice">班表以園方發布內容為準；同仁請假時，依下一週班表自行聯繫遞補。</div><section class="weeks" id="weeks"></section>
  <div class="footer">和美智慧校園｜115學年度上學期排班中心</div>
</main><script src="schedule_data.js"></script><script>
const types={early:{label:'幼兒部早值',slots:['A組','B組','AB組'],idx:[2,3,4]},late:{label:'幼兒部晚值',slots:['A組','B組','AB組'],idx:[5,6,7]},clean:{label:'掃地區域',slots:['走廊','樓梯'],idx:[8,9]},after:{label:'安親部晚值',slots:['晚值'],idx:[]}};
let active='early';
function localDate(s){return new Date(s+'T00:00:00')}
function fmt(s){const d=localDate(s);return `${d.getMonth()+1}/${d.getDate()}`}
function visibleWeeks(){const now=new Date();now.setHours(0,0,0,0);let i=HEREMAY_SCHEDULE_DATA.findIndex(r=>localDate(r[0])<=now&&now<=localDate(r[1]));if(i<0)i=HEREMAY_SCHEDULE_DATA.findIndex(r=>localDate(r[0])>now);if(i<0)i=Math.max(0,HEREMAY_SCHEDULE_DATA.length-3);return HEREMAY_SCHEDULE_DATA.slice(i,i+3)}
function renderTabs(){tabs.innerHTML=Object.entries(types).map(([k,t])=>`<button class="tab ${k===active?'active':''}" onclick="active='${k}';renderTabs();renderWeeks()">${t.label}</button>`).join('')}
function renderWeeks(){const t=types[active],data=visibleWeeks();weeks.innerHTML=data.map((r,i)=>{const rows=t.idx.length?t.idx.map((x,n)=>`<div class="duty"><small>${t.slots[n]}</small><strong>${r[x]}</strong></div>`).join(''):`<div class="empty">這項班表尚未匯入，發布後會在此顯示。</div>`;return `<article class="week ${i===0?'current':''}"><h2>${fmt(r[0])}－${fmt(r[1])}<span class="badge">${i===0?'本週':`未來第 ${i} 週`}</span></h2><div class="rows">${rows}</div></article>`}).join('')}
renderTabs();renderWeeks();
</script></body></html>
