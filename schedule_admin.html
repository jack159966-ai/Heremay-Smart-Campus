<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>和美智慧校園｜排班管理</title>
<style>
:root{--blue:#317fa9;--deep:#173f61;--line:#cde2ef;--soft:#eff8fd;--muted:#668498}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#edf7fc;color:#263b49}
.app{width:min(1200px,100%);margin:auto;padding:22px}.head,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px #2b6d9120}
.head{padding:20px 24px;display:flex;align-items:center;gap:14px}.head h1{margin:0;color:var(--deep)}.head p{margin:5px 0 0;color:#658399;font-weight:700}
.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer;background:var(--blue);color:#fff}
.btn.secondary{background:var(--soft);color:var(--deep);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{margin-top:16px;padding:20px}.card h2{margin:0 0 6px;color:var(--deep)}.sub{margin:0 0 16px;color:var(--muted);font-weight:700}
.formGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:var(--muted);font-weight:900}
select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:800;color:var(--deep);background:#fff}
.stageBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stage{padding:8px 12px;border-radius:999px;background:#f1f5f8;color:#7890a0;font-size:13px;font-weight:900;border:1px solid #dae8ef}.stage.active{background:#dff1fb;color:var(--deep);border-color:#a9d4e8}
.builder{margin-top:16px;border:1px dashed #a8cfe1;border-radius:16px;padding:16px;background:#fbfeff}.builder.empty{text-align:center;color:var(--muted);font-weight:800}
.slotGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.slotCard{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.slotCard strong{display:block;color:var(--deep);margin-bottom:7px}.slotCard small{color:var(--muted);font-weight:700}.pickGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.pickGrid select{width:100%}.picked{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--soft);color:var(--deep);font-weight:900;min-height:38px}.cloudStatus{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f5f8fa;color:var(--muted);font-weight:900}.cloudStatus.ok{background:#eaf7f0;color:#256e4c}.cloudStatus.err{background:#fff0f0;color:#a33}
.tableWrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:900px}th{background:var(--deep);color:#fff;padding:12px 9px}td{padding:11px 9px;border-bottom:1px solid #e2edf3;text-align:center;font-weight:750}tr.current td{background:#fff4d9}td:first-child{font-weight:900;color:var(--deep)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.legend span{background:var(--soft);padding:8px 11px;border-radius:10px;font-weight:800}.footer{text-align:center;color:#6d8798;margin-top:16px;font-weight:700;font-size:13px}
.mobileBlock{display:none}@media(max-width:540px){.app>*:not(.mobileBlock){display:none}.mobileBlock{display:block;background:#fff;border:2px solid var(--line);border-radius:24px;padding:30px 20px;text-align:center;margin-top:50px}}
</style>
</head>
<body><main class="app">
<div class="mobileBlock"><h2>排班管理限電腦操作</h2><p>請改用電腦開啟主管工作台。</p><button class="btn" onclick="history.back()">返回</button></div>
<header class="head"><div style="font-size:42px">🗓️</div><div><h1>排班管理 v1.5.2</h1><p>115學年度上學期｜雲端人員讀取</p></div><div class="actions"><button class="btn secondary" onclick="location.href='admin.html'">返回主管頁</button><button class="btn" onclick="window.open('https://docs.google.com/spreadsheets/d/1NlrmL8L0TpKbRsTeINYb2_8fp8GHiGywbMktUNSwaOU/edit','_blank')">開啟正式版資料庫</button></div></header>

<section class="card">
<h2>建立／調整班表</h2><p class="sub">人員名單與班表類型由排班中心 Apps Script 一次讀取；這一版仍不會寫入 Google Sheet。</p>
<div class="formGrid">
<div class="field"><label>① 班表類型</label><select id="typeSelect"><option value="">請選擇班表</option><option value="KINDER_EARLY">幼兒部早值</option><option value="KINDER_LATE">幼兒部晚值</option><option value="AFTER_DUTY">安親部晚值</option><option value="CLEANING">掃地區域</option><option value="FB_POST">粉專投稿</option><option value="MORNING_ACTIVITY">晨間遊戲區</option><option value="MORNING_HOST">晨間活動主持</option></select></div>
<div class="field"><label>② 週次</label><select id="weekSelect"><option value="">請選擇週次</option></select></div>
<div class="field"><label>③ 狀態</label><select disabled><option>草稿</option></select></div>
</div>
<div class="stageBar"><span class="stage active">選班表</span><span class="stage">選週次</span><span class="stage">安排人員／單位</span><span class="stage">儲存草稿</span><span class="stage">發布</span></div>
<div id="cloudStatus" class="cloudStatus">正在連線排班中心資料…</div>
<div id="builder" class="builder empty">請先選擇「班表類型」與「週次」。</div>
</section>

<section class="card">
<div><label>顯示範圍 <select id="range"><option value="all">整學期</option><option value="3">本週起三週</option></select></label></div>
<div class="tableWrap"><table><thead><tr><th rowspan="2">週次</th><th colspan="3">幼兒部早值</th><th colspan="3">幼兒部晚值</th><th colspan="2">掃地區域</th></tr><tr><th>A組</th><th>B組</th><th>AB組</th><th>A組</th><th>B組</th><th>AB組</th><th>走廊</th><th>樓梯</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="legend"><span>早值優先</span><span>同週早、晚值不得同人</span><span>一般輪值異動由主管發布</span></div>
</section>
<div class="footer">和美智慧校園｜主管排班管理 v1.5.2</div>
</main>

<script src="schedule_data.js"></script>
<script>
let TYPE_DEF = {};

const SCHEDULE_API = 'https://script.google.com/macros/s/AKfycbw-vNSfGNciRGnEC3rNTHk0qnZzZSD0m17WrhISxN2HD_YvO3JscLPdQPLcgr2fFYrz/exec';

let PEOPLE = [];
let SCHEDULE_TYPES = [];
let TYPE_DEF = {};
let BOOTSTRAP_READY = false;

function loadBootstrap(){
  cloudStatus.className='cloudStatus';
  cloudStatus.textContent='正在連線排班中心資料…';

  const callbackName='scheduleBootstrapCallback_'+Date.now();

  window[callbackName]=function(data){
    try{
      receiveBootstrap(data);
    }finally{
      try{ delete window[callbackName]; }catch(e){ window[callbackName]=undefined; }
      const old=document.getElementById('bootstrapApiJsonp');
      if(old) old.remove();
    }
  };

  const old=document.getElementById('bootstrapApiJsonp');
  if(old) old.remove();

  const script=document.createElement('script');
  script.id='bootstrapApiJsonp';
  script.async=true;
  script.src=SCHEDULE_API
    +'?action=bootstrap'
    +'&callback='+encodeURIComponent(callbackName)
    +'&t='+Date.now();

  script.onerror=()=>{
    try{ delete window[callbackName]; }catch(e){ window[callbackName]=undefined; }
    setBootstrapError('無法載入排班中心資料');
  };

  document.head.appendChild(script);

  setTimeout(()=>{
    if(!BOOTSTRAP_READY){
      try{ delete window[callbackName]; }catch(e){ window[callbackName]=undefined; }
      setBootstrapError('排班中心回應逾時');
    }
  },12000);
}

function setBootstrapError(msg){
  if(BOOTSTRAP_READY) return;

  PEOPLE=[];
  SCHEDULE_TYPES=[];
  TYPE_DEF={};
  typeSelect.innerHTML='<option value="">班表資料讀取失敗</option>';

  cloudStatus.className='cloudStatus err';
  cloudStatus.textContent='排班中心連線失敗｜'+msg;
  renderBuilder();
}

function renderBuilder(){
  const t=TYPE_DEF[typeSelect.value],w=weekSelect.value;
  if(!t||!w){
    builder.className='builder empty';
    builder.textContent='請先選擇「班表類型」與「週次」。';
    return
  }
  if(!BOOTSTRAP_READY){
    builder.className='builder empty';
    builder.textContent='排班中心資料尚未載入，請先確認上方連線狀態。';
    return
  }
  const [s,e]=w.split('|');
  builder.className='builder';
  builder.innerHTML=`
    <div style="margin-bottom:12px">
      <strong style="font-size:18px;color:var(--deep)">${t.label}</strong>
      <div style="color:var(--muted);font-weight:800;margin-top:4px">${f(s)}－${f(e)}｜${t.mode}排班</div>
    </div>
    <div class="slotGrid">
      ${t.slots.map((x,i)=>personPicker(i,x,t)).join('')}
    </div>
    <div style="margin-top:14px">
      <button class="btn" disabled>儲存草稿（下一階段）</button>
    </div>`;

  document.querySelectorAll('.slotCard').forEach((card,i)=>{
    const dept=card.querySelector('.dept');
    dept.value=t.dept||'';
    cascade(i,'dept');
  });
}

function getCard(i){return document.querySelector(`.slotCard[data-slot="${i}"]`)}

function cascade(i,level){
  const card=getCard(i); if(!card)return;
  const dept=card.querySelector('.dept');
  const grade=card.querySelector('.grade');
  const cls=card.querySelector('.cls');
  const person=card.querySelector('.person');

  if(level==='dept'){
    const rows=PEOPLE.filter(p=>!dept.value||p[1]===dept.value);
    grade.innerHTML=options(uniq(rows.map(p=>p[2])),'年級');
    cls.innerHTML='<option value="">班級</option>';
    person.innerHTML='<option value="">姓名</option>';
    document.getElementById(`picked-${i}`).textContent='尚未選擇';
  }
  if(level==='grade'){
    const rows=PEOPLE.filter(p=>(!dept.value||p[1]===dept.value)&&(!grade.value||p[2]===grade.value));
    cls.innerHTML=options(uniq(rows.map(p=>p[3])),'班級');
    person.innerHTML='<option value="">姓名</option>';
    document.getElementById(`picked-${i}`).textContent='尚未選擇';
  }
  if(level==='cls'){
    const rows=PEOPLE.filter(p=>(!dept.value||p[1]===dept.value)&&(!grade.value||p[2]===grade.value)&&(!cls.value||p[3]===cls.value));
    person.innerHTML=options(rows.map(p=>p[0]),'姓名');
    document.getElementById(`picked-${i}`).textContent='尚未選擇';
  }
}

function showPicked(i){
  const card=getCard(i); if(!card)return;
  const person=card.querySelector('.person').value;
  const cls=card.querySelector('.cls').value;
  const picked=document.getElementById(`picked-${i}`);
  picked.textContent=person ? `${cls}｜${person}` : '尚未選擇';
}

range.onchange=render;
typeSelect.onchange=renderBuilder;
weekSelect.onchange=renderBuilder;
fillWeeks();render();renderBuilder();loadBootstrap();
</script>
</body></html>
