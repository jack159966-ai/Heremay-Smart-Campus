<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和美智慧校園｜排班管理</title>
<style>
:root{--blue:#317fa9;--deep:#173f61;--line:#cde2ef;--soft:#eff8fd}*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#edf7fc;color:#263b49}.app{width:min(1200px,100%);margin:auto;padding:22px}.head,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px #2b6d9120}.head{padding:20px 24px;display:flex;align-items:center;gap:14px}.head h1{margin:0;color:var(--deep)}.head p{margin:5px 0 0;color:#658399;font-weight:700}.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer;background:var(--blue);color:#fff}.btn.secondary{background:var(--soft);color:var(--deep);border:1px solid var(--line)}.card{margin-top:16px;padding:20px}.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.tools select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:800;color:var(--deep)}.note{margin-left:auto;color:#668498;font-weight:700}.tableWrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:900px}th{position:sticky;top:0;background:var(--deep);color:#fff;padding:12px 9px}td{padding:11px 9px;border-bottom:1px solid #e2edf3;text-align:center;font-weight:750}tr.current td{background:#fff4d9}td:first-child{font-weight:900;color:var(--deep)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.legend span{background:var(--soft);padding:8px 11px;border-radius:10px;font-weight:800}.mobileBlock{display:none}.footer{text-align:center;color:#6d8798;margin-top:16px;font-weight:700;font-size:13px}@media(max-width:820px){.app>*:not(.mobileBlock){display:none}.mobileBlock{display:block;background:#fff;border:2px solid var(--line);border-radius:24px;padding:30px 20px;text-align:center;margin-top:50px}.mobileBlock h2{color:var(--deep)}.mobileBlock button{margin-top:14px}}
</style></head><body><main class="app"><div class="mobileBlock"><div style="font-size:48px">🖥️</div><h2>排班管理限電腦操作</h2><p>請改用電腦開啟主管工作台，方便比對人員與班表。</p><button class="btn" onclick="history.back()">返回</button></div>
<header class="head"><div style="font-size:42px">🗓️</div><div><h1>排班管理</h1><p>115學年度上學期｜電腦版</p></div><div class="actions"><button class="btn secondary" onclick="location.href='admin.html'">返回主管頁</button><button class="btn" onclick="window.open('https://docs.google.com/spreadsheets/d/1NlrmL8L0TpKbRsTeINYb2_8fp8GHiGywbMktUNSwaOU/edit','_blank')">開啟排班資料庫</button></div></header>
<section class="card"><div class="tools"><label>顯示範圍 <select id="range"><option value="all">整學期</option><option value="3">本週起三週</option></select></label><span class="note">目前先核對已排好的早晚值與掃地區域</span></div><div class="tableWrap"><table><thead><tr><th rowspan="2">週次</th><th colspan="3">幼兒部早值</th><th colspan="3">幼兒部晚值</th><th colspan="2">掃地區域</th></tr><tr><th>A組</th><th>B組</th><th>AB組</th><th>A組</th><th>B組</th><th>AB組</th><th>走廊</th><th>樓梯</th></tr></thead><tbody id="body"></tbody></table></div><div class="legend"><span>早值優先</span><span>同週早、晚值不得同人</span><span>安親部晚值待排入</span><span>借一天還一天由同仁自行處理</span></div></section><div class="footer">和美智慧校園｜主管排班管理 v1.0</div></main><script src="schedule_data.js"></script><script>
function d(s){return new Date(s+'T00:00:00')}function f(s){const x=d(s);return `${x.getMonth()+1}/${x.getDate()}`}function startIndex(){const n=new Date();n.setHours(0,0,0,0);let i=HEREMAY_SCHEDULE_DATA.findIndex(r=>d(r[0])<=n&&n<=d(r[1]));if(i<0)i=HEREMAY_SCHEDULE_DATA.findIndex(r=>d(r[0])>n);return i<0?0:i}function render(){let data=HEREMAY_SCHEDULE_DATA;const si=startIndex();if(range.value==='3')data=data.slice(si,si+3);body.innerHTML=data.map((r,i)=>`<tr class="${d(r[0])<=new Date()&&new Date()<=new Date(r[1]+'T23:59:59')?'current':''}"><td>${f(r[0])}－${f(r[1])}</td>${r.slice(2).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}range.onchange=render;render();
</script></body></html>
