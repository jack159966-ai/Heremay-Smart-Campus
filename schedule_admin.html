<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>和美智慧校園｜排班管理</title>
<style>
:root{--blue:#317fa9;--deep:#173f61;--line:#cde2ef;--soft:#eff8fd;--muted:#668498}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;background:#edf7fc;color:#263b49}
.app{width:min(1200px,100%);margin:auto;padding:22px}.head,.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 24px #2b6d9120}
.head{padding:20px 24px;display:flex;align-items:center;gap:14px}.head h1{margin:0;color:var(--deep)}.head p{margin:5px 0 0;color:#658399;font-weight:700}
.actions{margin-left:auto;display:flex;gap:8px}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:900;cursor:pointer;background:var(--blue);color:#fff}
.btn.secondary{background:var(--soft);color:var(--deep);border:1px solid var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}
.card{margin-top:16px;padding:20px}.card h2{margin:0 0 6px;color:var(--deep)}.sub{margin:0 0 16px;color:var(--muted);font-weight:700}
.formGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:13px;color:var(--muted);font-weight:900}
select{padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-weight:800;color:var(--deep);background:#fff}
.stageBar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.stage{padding:8px 12px;border-radius:999px;background:#f1f5f8;color:#7890a0;font-size:13px;font-weight:900;border:1px solid #dae8ef}.stage.active{background:#dff1fb;color:var(--deep);border-color:#a9d4e8}
.builder{margin-top:16px;border:1px dashed #a8cfe1;border-radius:16px;padding:16px;background:#fbfeff}.builder.empty{text-align:center;color:var(--muted);font-weight:800}
.slotGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.slotCard{border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff}.slotCard strong{display:block;color:var(--deep);margin-bottom:7px}.slotCard small{color:var(--muted);font-weight:700}.pickGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}.pickGrid select{width:100%}.picked{margin-top:10px;padding:9px 10px;border-radius:10px;background:var(--soft);color:var(--deep);font-weight:900;min-height:38px}.cloudStatus{margin-top:12px;padding:10px 12px;border-radius:12px;background:#f5f8fa;color:var(--muted);font-weight:900}.cloudStatus.ok{background:#eaf7f0;color:#256e4c}.cloudStatus.err{background:#fff0f0;color:#a33}
.tableWrap{overflow:auto;margin-top:14px;border:1px solid var(--line);border-radius:16px}table{border-collapse:collapse;width:100%;min-width:900px}th{background:var(--deep);color:#fff;padding:12px 9px}td{padding:11px 9px;border-bottom:1px solid #e2edf3;text-align:center;font-weight:750}tr.current td{background:#fff4d9}td:first-child{font-weight:900;color:var(--deep)}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}.legend span{background:var(--soft);padding:8px 11px;border-radius:10px;font-weight:800}.footer{text-align:center;color:#6d8798;margin-top:16px;font-weight:700;font-size:13px}
.mobileBlock{display:none}@media(max-width:540px){.app>*:not(.mobileBlock){display:none}.mobileBlock{display:block;background:#fff;border:2px solid var(--line);border-radius:24px;padding:30px 20px;text-align:center;margin-top:50px}}

.monthWorkspace{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
.monthBoard{background:#fff;border:1px solid #cfe2ee;border-radius:16px;overflow:auto}
.monthHead,.monthRow{display:grid;grid-template-columns:150px repeat(var(--slot-count),minmax(130px,1fr))}
.monthHead{background:#174a70;color:#fff;font-weight:900}
.monthHead>div,.monthRow>div{padding:12px;border-right:1px solid #dbe8ef}
.monthRow{border-top:1px solid #dbe8ef}
.weekCell{font-weight:900}
.assignCell{min-height:68px;cursor:pointer}
.assignCell:hover,.assignCell.selected{background:#eef8fd}
.slotName{font-size:12px;color:#6f8798;margin-bottom:5px;font-weight:800}
.personName{font-weight:900;color:#173f5f}
.emptyText{color:#9aaebc;font-weight:800}
.drawer{position:sticky;top:12px;background:#fff;border:1px solid #cfe2ee;border-radius:16px;padding:16px}
.drawer h3{margin:0 0 6px}
.drawer .pickerGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drawer select{width:100%;padding:10px;border:1px solid #bfd7e5;border-radius:10px;background:#fff;font-weight:800}
.drawer .picked{margin-top:12px;padding:10px;border-radius:10px;background:#eef7fb;font-weight:900}
.recent{margin-top:14px;border-top:1px solid #e3edf3;padding-top:12px}
.recentItem{padding:8px 10px;border-radius:9px;background:#f5f8fa;font-size:13px;margin-bottom:7px}
@media(max-width:900px){.monthWorkspace{grid-template-columns:1fr}.drawer{position:static}.monthHead,.monthRow{min-width:760px}}
</style>
</head>
<body><main class="app">
<div class="mobileBlock"><h2>排班管理限電腦操作</h2><p>請改用電腦開啟主管工作台。</p><button class="btn" onclick="history.back()">返回</button></div>
<header class="head"><div style="font-size:42px">🗓️</div><div><h1>排班管理 v1.7</h1><p>115學年度上學期｜雲端人員讀取</p></div><div class="actions"><button class="btn secondary" onclick="location.href='admin.html'">返回主管頁</button><button class="btn" onclick="window.open('https://docs.google.com/spreadsheets/d/1NlrmL8L0TpKbRsTeINYb2_8fp8GHiGywbMktUNSwaOU/edit','_blank')">開啟正式版資料庫</button></div></header>

<section class="card">
<h2>建立／調整班表</h2><p class="sub">人員名單與班表類型由排班中心 Apps Script 一次讀取；這一版仍不會寫入 Google Sheet。</p>
<div class="formGrid">
<div class="field"><label>① 班表類型</label><select id="typeSelect"><option value="">請選擇班表</option><option value="KINDER_EARLY">幼兒部早值</option><option value="KINDER_LATE">幼兒部晚值</option><option value="AFTER_DUTY">安親部晚值</option><option value="CLEANING">掃地區域</option><option value="FB_POST">粉專投稿</option><option value="MORNING_ACTIVITY">晨間遊戲區</option><option value="MORNING_HOST">晨間活動主持</option></select></div>
<div class="field"><label>② 週次</label><select id="weekSelect"><option value="">請選擇週次</option></select></div>
<div class="field"><label>③ 狀態</label><select disabled><option>草稿</option></select></div>
</div>
<div class="stageBar"><span class="stage active">選班表</span><span class="stage">選週次</span><span class="stage">安排人員／單位</span><span class="stage">儲存草稿</span><span class="stage">發布</span></div>
<div id="cloudStatus" class="cloudStatus">正在連線排班中心資料…</div>
<div id="builder" class="builder empty">請先選擇「班表類型」與「週次」。</div>
</section>

<section class="card">
<div><label>顯示範圍 <select id="range"><option value="all">整學期</option><option value="3">本週起三週</option></select></label></div>
<div class="tableWrap"><table><thead><tr><th rowspan="2">週次</th><th colspan="3">幼兒部早值</th><th colspan="3">幼兒部晚值</th><th colspan="2">掃地區域</th></tr><tr><th>A組</th><th>B組</th><th>AB組</th><th>A組</th><th>B組</th><th>AB組</th><th>走廊</th><th>樓梯</th></tr></thead><tbody id="body"></tbody></table></div>
<div class="legend"><span>早值優先</span><span>同週早、晚值不得同人</span><span>一般輪值異動由主管發布</span></div>
</section>
<div class="footer">和美智慧校園｜主管排班管理 v1.7</div>
</main>

<script src="schedule_data.js"></script>
<script>
let TYPE_DEF={};

const SCHEDULE_API='https://script.google.com/macros/s/AKfycbw-vNSfGNciRGnEC3rNTHk0qnZzZSD0m17WrhISxN2HD_YvO3JscLPdQPLcgr2fFYrz/exec';

const typeSelect=document.getElementById('typeSelect');
const weekSelect=document.getElementById('weekSelect');
const cloudStatus=document.getElementById('cloudStatus');
const builder=document.getElementById('builder');
const range=document.getElementById('range');
const body=document.getElementById('body');

let PEOPLE=[];
let SCHEDULE_TYPES=[];
let BOOTSTRAP_READY=false;

function loadBootstrap(){
  cloudStatus.className='cloudStatus';
  cloudStatus.textContent='排班中心請求已送出…';

  const old=document.getElementById('bootstrapApiJsonp');
  if(old) old.remove();

  const script=document.createElement('script');
  script.id='bootstrapApiJsonp';
  script.src=SCHEDULE_API+'?action=bootstrap&callback=receiveBootstrap&t='+Date.now();

  script.onload=function(){
    if(!BOOTSTRAP_READY){
      cloudStatus.className='cloudStatus';
      cloudStatus.textContent='排班中心已回應，正在接收資料…';
    }
  };

  script.onerror=function(){
    setBootstrapError('無法載入排班中心資料');
  };

  document.head.appendChild(script);

  setTimeout(function(){
    if(!BOOTSTRAP_READY){
      setBootstrapError('排班中心回應逾時');
    }
  },12000);
}

function receiveBootstrap(data){
  try{
    if(!data || data.ok!==true || !Array.isArray(data.people) || !Array.isArray(data.types)){
      setBootstrapError(data && data.message ? data.message : '排班中心回傳格式不正確');
      return;
    }

    PEOPLE=data.people.map(function(p){
      return [
        String(p.name||'').trim(),
        String(p.department||'').trim(),
        String(p.grade||'').trim(),
        String(p.className||'').trim(),
        String(p.title||'').trim()
      ];
    }).filter(function(p){return p[0];});

    SCHEDULE_TYPES=data.types;
    TYPE_DEF={};
    typeSelect.innerHTML='<option value="">請選擇</option>';

    SCHEDULE_TYPES.forEach(function(t){
      const code=String(t.code||'').trim();
      const name=String(t.name||'').trim();
      if(!code || !name)return;

      const positions=Array.isArray(t.positions)?t.positions.filter(Boolean):[];
      const count=Number(t.assignmentCount||t.weeklyCount||positions.length||1);

      TYPE_DEF[code]={
        label:name,
        slots:positions.length?positions:Array.from(
          {length:(Number.isFinite(count)&&count>0?count:1)},
          function(_,i){return '位置'+(i+1);}
        ),
        mode:String(t.mode||'通用').trim(),
        dept:String(t.department||'').trim(),
        unit:String(t.rotationLevel||'老師').trim(),
        conflictGroup:String(t.conflictGroup||'').trim(),
        qualificationRule:String(t.qualificationRule||'').trim(),
        continueRotation:!!t.continueRotation,
        supervisorOverride:!!t.supervisorOverride
      };

      const op=document.createElement('option');
      op.value=code;
      op.textContent=name;
      typeSelect.appendChild(op);
    });

    BOOTSTRAP_READY=true;
    cloudStatus.className='cloudStatus ok';
    cloudStatus.textContent='排班中心連線成功｜'+PEOPLE.length+' 位啟用人員｜'+SCHEDULE_TYPES.length+' 種啟用班表';

    renderBuilder();
  }catch(err){
    setBootstrapError('接收資料時發生錯誤：'+(err&&err.message?err.message:String(err)));
  }
}

function setBootstrapError(msg){
  if(BOOTSTRAP_READY)return;
  PEOPLE=[];
  SCHEDULE_TYPES=[];
  TYPE_DEF={};
  typeSelect.innerHTML='<option value="">班表資料讀取失敗</option>';
  cloudStatus.className='cloudStatus err';
  cloudStatus.textContent='排班中心連線失敗｜'+msg;
}

function d(s){return new Date(s+'T00:00:00')}
function f(s){const x=d(s);return `${x.getMonth()+1}/${x.getDate()}`}

function startIndex(){
  const n=new Date();n.setHours(0,0,0,0);
  let i=HEREMAY_SCHEDULE_DATA.findIndex(r=>d(r[0])<=n&&n<=d(r[1]));
  if(i<0)i=HEREMAY_SCHEDULE_DATA.findIndex(r=>d(r[0])>n);
  return i<0?0:i
}

function render(){
  let data=HEREMAY_SCHEDULE_DATA;
  const si=startIndex();
  if(range.value==='3')data=data.slice(si,si+3);
  body.innerHTML=data.map(r=>`<tr class="${d(r[0])<=new Date()&&new Date()<=new Date(r[1]+'T23:59:59')?'current':''}">
    <td>${f(r[0])}－${f(r[1])}</td>${r.slice(2).map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')
}

function fillWeeks(){
  weekSelect.innerHTML='<option value="">請選擇週次</option>';
  HEREMAY_SCHEDULE_DATA.forEach(r=>{
    const op=document.createElement('option');
    op.value=r[0]+'|'+r[1];
    op.textContent=f(r[0])+'－'+f(r[1]);
    weekSelect.appendChild(op)
  })
}

function uniq(arr){return [...new Set(arr)]}
function options(items, placeholder){
  return `<option value="">${placeholder}</option>`+items.map(x=>`<option value="${x}">${x}</option>`).join('')
}


let CURRENT_CELL=null;
let MONTH_ASSIGNMENTS={};

function monthKey(code,week,slot){return code+'__'+week+'__'+slot;}

function buildWeeks(centerValue){
  const all=[...weekSelect.options].map(o=>o.value).filter(Boolean);
  let idx=all.indexOf(centerValue); if(idx<0)idx=0;
  const s=Math.max(0,idx-2);
  return all.slice(s,s+5);
}

function personPicker(prefix){
  return `<div class="pickerGrid">
    <select id="${prefix}_dept"></select><select id="${prefix}_grade"></select>
    <select id="${prefix}_class"></select><select id="${prefix}_name"></select>
  </div><div id="${prefix}_picked" class="picked">尚未選擇</div>`;
}

function renderBuilder(){
  const code=typeSelect.value, selectedWeek=weekSelect.value, t=TYPE_DEF[code];
  if(!code||!selectedWeek||!t){
    builder.className='builder empty'; builder.textContent='請先選擇「班表類型」與「週次」。'; return;
  }
  if(!BOOTSTRAP_READY){
    builder.className='builder empty'; builder.textContent='排班中心資料尚未載入，請先確認上方連線狀態。'; return;
  }
  const weeks=buildWeeks(selectedWeek);
  const slots=(t.slots&&t.slots.length)?t.slots:['位置1'];
  builder.className='builder';
  builder.innerHTML=`
    <div style="margin-bottom:14px">
      <div style="font-size:21px;font-weight:900;color:#174a70">${t.label||code}</div>
      <div style="color:#6d8798;margin-top:4px">顯示 ${weeks.length} 週｜點班表格子後，右側選人</div>
    </div>
    <div class="monthWorkspace">
      <div class="monthBoard" style="--slot-count:${slots.length}">
        <div class="monthHead"><div>週次</div>${slots.map(s=>`<div>${s}</div>`).join('')}</div>
        ${weeks.map(w=>`<div class="monthRow">
          <div class="weekCell">${w}${w===selectedWeek?'<div style="font-size:12px;color:#2f86b4;margin-top:4px">目前排班週</div>':''}</div>
          ${slots.map(s=>{
            const a=MONTH_ASSIGNMENTS[monthKey(code,w,s)];
            return `<div class="assignCell" data-code="${code}" data-week="${w}" data-slot="${s}">
              <div class="slotName">${s}</div>
              ${a?`<div class="personName">${a.className}｜${a.name}</div>`:`<div class="emptyText">點此安排</div>`}
            </div>`;
          }).join('')}
        </div>`).join('')}
      </div>
      <aside class="drawer">
        <h3>安排人員</h3>
        <div id="drawerContext" style="color:#617b8e;margin-bottom:14px">請先點左側班表格子。</div>
        <div id="drawerPicker" style="display:none">
          ${personPicker('drawer')}
          <div class="recent"><b>近期輪值參考</b><div id="recentList" style="margin-top:8px"></div></div>
          <div style="font-size:13px;color:#71899a;margin-top:12px">此版只測試操作，不會寫入 Google Sheet。</div>
        </div>
      </aside>
    </div>`;
  builder.querySelectorAll('.assignCell').forEach(el=>el.addEventListener('click',()=>openDrawer(el)));
}

function openDrawer(el){
  if(CURRENT_CELL)CURRENT_CELL.classList.remove('selected');
  CURRENT_CELL=el; el.classList.add('selected');
  const code=el.dataset.code, week=el.dataset.week, slot=el.dataset.slot;
  document.getElementById('drawerContext').textContent=week+'｜'+slot;
  document.getElementById('drawerPicker').style.display='block';
  setupCascade('drawer',code,week,slot);
  renderRecent(code,week,slot);
}

function setupCascade(prefix,code,week,slot){
  const dept=document.getElementById(prefix+'_dept');
  const grade=document.getElementById(prefix+'_grade');
  const cls=document.getElementById(prefix+'_class');
  const name=document.getElementById(prefix+'_name');
  const picked=document.getElementById(prefix+'_picked');
  const type=TYPE_DEF[code]||{};
  function fill(sel,items,ph){sel.innerHTML='<option value="">'+ph+'</option>'+uniq(items).map(v=>`<option>${v}</option>`).join('');}
  fill(dept,PEOPLE.map(p=>p[1]),'部門');
  if(type.dept&&[...dept.options].some(o=>o.value===type.dept))dept.value=type.dept;
  function g(){fill(grade,PEOPLE.filter(p=>!dept.value||p[1]===dept.value).map(p=>p[2]),'年級');c();}
  function c(){fill(cls,PEOPLE.filter(p=>(!dept.value||p[1]===dept.value)&&(!grade.value||p[2]===grade.value)).map(p=>p[3]),'班級');n();}
  function n(){
    const rows=PEOPLE.filter(p=>(!dept.value||p[1]===dept.value)&&(!grade.value||p[2]===grade.value)&&(!cls.value||p[3]===cls.value));
    name.innerHTML='<option value="">姓名</option>'+rows.map(p=>`<option value="${p[0]}">${p[0]}</option>`).join('');
    show();
  }
  function show(){
    const p=PEOPLE.find(x=>x[0]===name.value);
    if(!p){picked.textContent='尚未選擇';return;}
    picked.textContent=p[3]+'｜'+p[0];
    MONTH_ASSIGNMENTS[monthKey(code,week,slot)]={name:p[0],department:p[1],grade:p[2],className:p[3],title:p[4]};
    renderBuilder();
    const target=[...builder.querySelectorAll('.assignCell')].find(x=>x.dataset.week===week&&x.dataset.slot===slot);
    if(target)openDrawer(target);
  }
  dept.onchange=g;grade.onchange=c;cls.onchange=n;name.onchange=show;g();
}

function renderRecent(code,week,slot){
  const list=document.getElementById('recentList');
  const arr=[];
  Object.entries(MONTH_ASSIGNMENTS).forEach(([k,v])=>{
    if(!k.startsWith(code+'__'))return;
    const parts=k.split('__');
    if(parts[1]===week&&parts[2]===slot)return;
    arr.push({week:parts[1],slot:parts[2],...v});
  });
  list.innerHTML=arr.length?arr.slice(-8).reverse().map(x=>`<div class="recentItem"><b>${x.week}</b>｜${x.slot}<br>${x.className}｜${x.name}</div>`).join(''):'<div class="recentItem">目前尚無本頁面已安排的近期紀錄。</div>';
}

if(range)range.onchange=render;
if(typeSelect)typeSelect.onchange=renderBuilder;
if(weekSelect)weekSelect.onchange=renderBuilder;
window.addEventListener('error',function(e){
  if(cloudStatus&&!BOOTSTRAP_READY){
    cloudStatus.className='cloudStatus err';
    cloudStatus.textContent='頁面程式錯誤｜'+e.message;
  }
});

fillWeeks();
render();
renderBuilder();
loadBootstrap();
</script>
</body></html>
