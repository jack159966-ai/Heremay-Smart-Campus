<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和美智慧校園｜正向管教列印成冊</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#223b55;font:16px/1.5 "Microsoft JhengHei","Noto Sans CJK TC",sans-serif}.controls{max-width:980px;margin:0 auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:25px;margin:0}.version{font-size:12px;color:#63768a}button,input,select{font:inherit}button{border:1px solid #b8cce5;border-radius:10px;padding:10px 16px;background:#e8f1ff;color:#244e85;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:default}.back{background:#4f86c6;color:white;white-space:nowrap}.card{border:1px solid #d3dfea;border-radius:15px;background:white;padding:16px;margin-top:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:block;min-width:0;font-weight:700;font-size:14px}select{width:100%;min-width:0;padding:9px;border:1px solid #bacbdc;border-radius:9px;background:#fff;margin-top:5px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.status{white-space:pre-wrap;padding:12px;border-radius:10px;background:#e7f0ff;margin-top:12px}.status.error{background:#ffe8e8;color:#982424}.note{font-size:14px;color:#5a7084;margin:10px 0 0}#previewWrap{overflow-x:auto;padding:0 12px 20px}#preview:empty{display:none}.sheet{width:180mm;height:277mm;margin:20px auto;padding:0;background:white;color:#111;position:relative;box-shadow:0 3px 15px #223b5520;font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif}.sheetContent{padding:0}.sheetHeader{display:block;text-align:center;margin-bottom:2mm;padding-top:1mm}.sheetHeader h2{font-size:14pt;line-height:1.15;margin:0 0 1.3mm;font-weight:700}.sheetMeta{display:flex;justify-content:space-between;gap:4mm;font-size:10pt;line-height:1.35}.scoreTable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12pt;line-height:1.08}.scoreTable th,.scoreTable td{border:.2mm solid #555;padding:.35mm .6mm;text-align:center;vertical-align:middle}.scoreTable th{background:#f0f0f0;font-weight:700}.scoreTable .question{text-align:left;font-size:12pt;line-height:1.08}.scoreTable .monthStart{border-left:.4mm solid #333}.scoreTable .sum{font-weight:700}.scoreTable .monthState{font-size:10pt;line-height:1.3}.legend{font-size:10pt;line-height:1.25;margin:1.3mm 0}.comments{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12pt;line-height:1.15}.comments th,.comments td{border:.2mm solid #555;padding:1mm;vertical-align:top}.comments th{background:#f0f0f0;text-align:center;font-size:12pt}.commentText{white-space:pre-wrap;overflow-wrap:anywhere;min-height:10mm}.reviewer{font-size:10pt;margin-top:1mm;color:#444}.sheetFooter{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;font-size:10pt;line-height:1.3;border-top:.2mm solid #999;padding-top:1mm}.continuation{font-size:10pt;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.continuation h3{font-size:12pt;line-height:1.3;margin:3mm 0 2mm}.emptyMessage{padding:12mm 0;text-align:center;font-size:12pt}.pageBodyLimit{height:270mm;width:100%;position:absolute;visibility:hidden;pointer-events:none;top:0}body[data-ready="false"] #printNow{pointer-events:none}[hidden]{display:none!important}
@media(max-width:680px){.controls{padding:14px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}h1{font-size:21px}}
@page{size:A4 portrait;margin:10mm 10mm 10mm 20mm}
@media print{body{background:white;margin:0;color:#111}.controls{display:none!important}#previewWrap{padding:0;overflow:visible}.sheet{margin:0;padding:0;box-shadow:none;break-after:page;page-break-after:always;width:180mm;height:277mm;break-inside:avoid;page-break-inside:avoid}.sheet:last-child{break-after:auto;page-break-after:auto}th{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
.monthState{white-space:pre-line}.scoreTable .question{padding-top:1.1mm;padding-bottom:1.1mm}.scoreTable .monthState{font-size:11pt;line-height:1.25}
</style></head><body data-ready="false">
<main class="controls"><header><div><h1>正向管教列印成冊</h1><div class="version">v1.1.0｜電腦列印</div></div><button class="back" type="button" onclick="location.href='positive_discipline.html?v=1.1.0'">← 返回</button></header>
<section class="card"><div class="filters"><label>老師<select id="teacher" disabled><option>正在讀取…</option></select></label><label>開始學期<select id="fromTerm" disabled></select></label><label>結束學期<select id="toTerm" disabled></select></label></div><div class="actions"><button id="load" type="button" disabled>產生列印預覽</button><button id="printNow" type="button" disabled>列印／另存 PDF</button></div><p class="note">每位老師各自成冊。2～7月一頁；8月～隔年1月一頁。A4 直式，左側留 20 mm 裝訂空間。</p><p class="note">列印請關閉瀏覽器的「頁首及頁尾」，縮放選 100%。未提交與待閱月份會標示清楚；每頁列出15題、六個月份選填結果、提交日期與園長已閱紀錄。</p></section>
<div id="status" class="status" role="status">正在讀取老師與學期…</div></main>
<div id="previewWrap"><div id="preview"></div></div>
<script src="self_eval_client.js?v=1.0.0"></script><script src="positive_discipline_print_model.js?v=1.1.0"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),model=PositivePrintModel;let index,busy=false,generation=0;const teachers=new Map();
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function element(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e}
function option(select,value,label){const o=element('option',label);o.value=value;select.append(o)}
function setReady(ready){document.body.dataset.ready=String(ready);$('printNow').disabled=!ready}
function invalidate(){generation++;setReady(false);$('preview').replaceChildren();status('條件已變更，請重新產生列印預覽。')}
function formatMonth(month){return Number(month.split('-')[1])+'月'}
function basePage(page,teacher,subtitle){const sheet=element('article',undefined,'sheet'),body=element('div',undefined,'sheetContent'),header=element('header',undefined,'sheetHeader');header.append(element('h2','和美幼兒園｜正向管教自我檢核紀錄'));const meta=element('div',undefined,'sheetMeta');meta.append(element('span','姓名：'+teacher.name+'　員工編號：'+teacher.employeeNo+'　部門：'+(page.department||teacher.department)),element('span',model.label(page.term)+(subtitle?'｜'+subtitle:'')));header.append(meta);body.append(header);sheet.append(body,element('div',undefined,'sheetFooter'));return {sheet,body}}
function cell(row,tag,text,span,className){const c=element(tag,text,className);if(span)c.colSpan=span;row.append(c);return c}
function recordState(page,month){const r=page.byMonth?.get(month);return r?r.status==='已複檢'?'已複審':'待複審':page.otherMonths?.includes(month)?'另一題庫版本':'無已交紀錄'}
function printDate(value){if(!value)return '';const p=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(value)).map(x=>[x.type,x.value]));return p.year+'\n'+p.month+'/'+p.day}
function scorePage(page,teacher){const {sheet,body}=basePage(page,teacher);if(page.empty){body.append(element('div','此學期沒有已提交的正向管教紀錄。','emptyMessage'));return {sheet,body}}
const table=element('table',undefined,'scoreTable'),cols=element('colgroup');for(const width of ['6mm','78mm',...Array(6).fill('16mm')]){const col=element('col');col.style.width=width;cols.append(col)}table.append(cols);const head=element('thead'),row=element('tr');cell(row,'th','題號');cell(row,'th','正向管教檢核項目');page.months.forEach(m=>cell(row,'th',formatMonth(m),1,'monthStart'));head.append(row);table.append(head);const tbody=element('tbody');page.questions.forEach((text,i)=>{const row=element('tr');cell(row,'td',String(i+1));cell(row,'td',text.replace(/^\d+\.\s*/,''),1,'question');page.months.forEach(m=>cell(row,'td',model.answer(page.byMonth.get(m),i),1,'monthStart'));tbody.append(row)});
const rows=[['繳交狀態',r=>r?'已提交':'無紀錄'],['老師提交日期',r=>printDate(r?.submittedAt)],['園長閱覽狀態',r=>r?r.status==='已閱'?'已閱':'待閱':''],['園長已閱日期',r=>r?.status==='已閱'?printDate(r.acknowledgedAt):''],['園長姓名',r=>r?.status==='已閱'?r.acknowledgedBy||'':'']];rows.forEach(([label,value])=>{const row=element('tr');cell(row,'td',label,2,'sum');page.months.forEach(m=>cell(row,'td',value(page.byMonth.get(m)),1,'monthState monthStart'));tbody.append(row)});table.append(tbody);body.append(table,element('p','選填結果直接取自老師已提交的紀錄。空白欄位沒有已交資料；園長「已閱」僅表示閱覽確認。','legend'));return {sheet,body}}
function fits(body){return body.getBoundingClientRect().height<=270*96/25.4+.5}
async function preparePages(data,teacher,from,to){const pages=model.build(data.records,data.bank,from,to),preview=$('preview');preview.replaceChildren();if(!data.records.length){status('這位老師在所選學期沒有已提交的正向管教紀錄，請調整學期。');return false}await document.fonts.ready;for(const page of pages){const rendered=scorePage(page,teacher);preview.append(rendered.sheet);if(!fits(rendered.body))throw Error('此頁內容超出A4，請核對題目與姓名長度。')}const sheets=[...preview.querySelectorAll('.sheet')];sheets.forEach((sheet,i)=>{const footer=sheet.querySelector('.sheetFooter');footer.append(element('span','老師：'+teacher.name+'｜正向管教紀錄冊'),element('span','第 '+(i+1)+'／'+sheets.length+' 頁'))});return true}

async function load(){if(busy)return;const employeeNo=$('teacher').value,from=$('fromTerm').value,to=$('toTerm').value;let teacher=teachers.get(employeeNo);if(!teacher){status('請先選擇老師。',true);return}try{model.terms(from,to)}catch(e){status(e.message,true);return}busy=true;setReady(false);$('preview').replaceChildren();const token=++generation;$('load').disabled=true;[$('teacher'),$('fromTerm'),$('toTerm')].forEach(e=>e.disabled=true);try{status('正在讀取已提交的選填結果，產生列印預覽…');const result=await HeremaySelfEval.call('selfEvalPositivePrint',{employeeNo,fromTerm:from,toTerm:to});if(token!==generation)return;const ready=await preparePages(result,teacher,from,to);setReady(ready);if(ready)status('已產生 '+$('preview').children.length+' 頁。請核對老師、學期與選填結果後列印。')}catch(e){$('preview').replaceChildren();setReady(false);status(e.message,true)}finally{busy=false;$('load').disabled=false;[$('teacher'),$('fromTerm'),$('toTerm')].forEach(e=>e.disabled=false)}}
async function init(){try{index=await HeremaySelfEval.call('selfEvalPositivePrintIndex');$('teacher').replaceChildren();option($('teacher'),'','請選擇老師');index.teachers.forEach(t=>{teachers.set(String(t.employeeNo),t);option($('teacher'),String(t.employeeNo),t.department+'｜'+t.name+'（'+t.employeeNo+'）')});const current=model.termFor(index.month),all=[...new Set([...index.months.map(model.termFor),current])].sort();for(const term of all){option($('fromTerm'),term,model.label(term));option($('toTerm'),term,model.label(term))}$('fromTerm').value=$('toTerm').value=current;[$('teacher'),$('fromTerm'),$('toTerm'),$('load')].forEach(e=>e.disabled=false);status('請選擇老師與學期範圍，再產生列印預覽。')}catch(e){status(e.message+'\n請返回自評管理頁確認主管登入，或檢查後端是否已部署新版本。',true)}}
[$('teacher'),$('fromTerm'),$('toTerm')].forEach(e=>e.onchange=invalidate);$('load').onclick=load;$('printNow').onclick=()=>{if(!$('printNow').disabled)window.print()};init();
})();
</script></body></html>
