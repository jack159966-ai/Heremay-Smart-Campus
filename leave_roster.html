<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今明日請假名單｜和美智慧校園</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f2f7f8;color:#24434b;font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei",sans-serif}main{max-width:850px;margin:auto;padding:20px 16px 40px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:26px;margin:14px 0}button,a{font:inherit;border:1px solid #b8d1d4;border-radius:14px;background:white;padding:11px 15px;color:#245e65;text-decoration:none;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:15px 0}.toolbar span{font-size:14px}#status{font-size:15px;line-height:1.7;margin:10px 0 18px;color:#526b73}.days{display:grid;grid-template-columns:1fr 1fr;gap:18px}.day{border:1px solid #d4e2e5;background:white;border-radius:22px;padding:20px;box-shadow:0 5px 20px #254c5010}h2{margin:0 0 5px;font-size:25px}.date{color:#597680;font-size:17px;margin-bottom:16px}.count{font-size:15px;background:#eaf6f4;padding:8px 12px;border-radius:10px;margin-bottom:14px}.person{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid #e8eef0}.person strong{display:block;font-size:23px;overflow-wrap:anywhere}.person small{display:block;font-size:16px;color:#59717a;margin-top:5px}.period{font-size:17px;font-weight:800;background:#edf3ff;color:#3b5990;padding:8px 12px;border-radius:12px;white-space:nowrap}.empty{padding:25px 0;color:#637b82;font-size:19px}.note{font-size:14px;color:#60767c;line-height:1.8;margin:20px 0}.error{color:#a33c22!important}button:disabled{opacity:.5}.day.tomorrow h2{color:#866241}@media(max-width:620px){.days{grid-template-columns:1fr}h1{font-size:23px}.toolbar{align-items:flex-start}.day{padding:18px}}</style></head>
<body><main><header><h1>📋 今明日請假名單</h1><a id="back" href="index.html">← 返回首頁</a></header><div class="toolbar"><span>v1.0.0｜已核准請假</span><button id="refresh" type="button">🔄 更新名單</button></div><p id="status" role="status" aria-live="polite">正在讀取名單…</p><div class="days" id="days"></div><p class="note">今天與明天分開顯示，供查看與支援人力安排。名單包含自動成立及已核准的假單。</p></main>
<script>
'use strict';
const API='https://script.google.com/macros/s/AKfycbzQIkRS3hLLiDMQj6WV6SyeEmFHO80f_Sl9qHciPkWpXZfuzggmfdTRLjtbvhhMZ624Zw/exec';
let employee={};try{employee=JSON.parse(localStorage.getItem('heremay.currentEmployee')||'{}')||{}}catch(_){}
const identity=[employee.category,employee.identity,employee.identityType,employee.jobTitle,employee.title,employee.group,employee.department,employee.homeType,employee['身分類別'],employee['職稱']].filter(Boolean).join(' ');
const role=String(employee.role||localStorage.getItem('heremay.currentRole')||'');
const home=String(employee.homeType||employee.home||employee['首頁類型']||'');
const back=role==='admin'||/管理首頁|主管首頁/.test(home)&&!/中階/.test(home)?'admin.html':role==='leader'||/中階/.test(home)?'leader.html':'teacher.html';
document.getElementById('back').href=back;
const employeeId=String(employee.employeeId||employee.employeeNo||employee.id||employee['員工編號']||'').trim();
const permitted=!!employeeId&&!/鐘點|庶務/.test(identity)&&(role==='admin'||role==='leader'||role==='teacher'||/管理首頁|中階主管首頁|教保首頁/.test(home));
let records=[],syncedAt='',busy=false,shownDate='';const cacheKey='heremay.leaveRoster.v1.'+employeeId;
function dateKeys(now=new Date()){const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(now);const tomorrow=new Date(today+'T00:00:00+08:00');tomorrow.setUTCDate(tomorrow.getUTCDate()+1);return [today,new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(tomorrow)]}
function approved(rows){return rows.filter(x=>['已核准','自動成立'].includes(String(x.status||'').trim())).map(x=>({employeeName:String(x.employeeName||''),pool:String(x.pool||''),date:String(x.date||''),period:String(x.period||'全天')}))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(known){const dates=dateKeys();shownDate=dates[0];document.getElementById('days').innerHTML=dates.map((date,i)=>{const rows=records.filter(x=>x.date===date).sort((a,b)=>a.pool.localeCompare(b.pool,'zh-Hant')||a.employeeName.localeCompare(b.employeeName,'zh-Hant'));const am=rows.filter(x=>x.period!=='下午').length,pm=rows.filter(x=>x.period!=='上午').length;const label=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',month:'numeric',day:'numeric',weekday:'long'}).format(new Date(date+'T12:00:00+08:00'));return '<section class="day '+(i?'tomorrow':'')+'"><h2>'+(i?'明天':'今天')+'</h2><div class="date">'+label+'</div>'+(known?'<div class="count">上午 '+am+' 人｜下午 '+pm+' 人</div>':'')+(rows.length?rows.map(x=>'<div class="person"><div><strong>'+esc(x.employeeName||'未具名')+'</strong><small>'+esc(x.pool)+'</small></div><span class="period">'+esc(x.period)+'</span></div>').join(''):'<div class="empty">'+(known?'無人請假':'尚未取得名單')+'</div>')+'</section>'}).join('')}
function request(){return new Promise((resolve,reject)=>{const cb='rosterCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');const t=setTimeout(()=>{clear();reject(new Error('讀取逾時，請再按更新名單'))},30000);function clear(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=r=>{clear();resolve(r)};s.onerror=()=>{clear();reject(new Error('連線失敗，請確認網路後重試'))};s.src=API+'?'+new URLSearchParams({action:'getAttendanceBundle',employeeId,pool:employee.department||employee.group||'',callback:cb,_:Date.now()});document.head.appendChild(s)})}
function timeLabel(){return new Date(syncedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false})}
async function refresh(){if(!permitted||busy)return;busy=true;document.getElementById('refresh').disabled=true;const status=document.getElementById('status');status.className='';status.textContent=syncedAt?'正在更新名單…（上次更新：'+timeLabel()+'）':'正在讀取名單…';try{const r=await request();if(!r.ok)throw new Error(r.message||'讀取失敗');if(!Array.isArray(r.overviewLeaves))throw new Error('尚未取得今明日名單，請確認差勤介面版本');records=approved(r.overviewLeaves);syncedAt=new Date().toISOString();render(true);try{localStorage.setItem(cacheKey,JSON.stringify({date:dateKeys()[0],records,syncedAt}))}catch(_){}status.textContent='更新時間：'+timeLabel()}catch(e){status.className='error';status.textContent=e.message+(syncedAt?'。目前顯示上次名單（'+timeLabel()+'），請更新後再確認。':'。目前無法確認是否有人請假。')}finally{busy=false;document.getElementById('refresh').disabled=false}}
document.getElementById('refresh').onclick=refresh;
if(!permitted){document.getElementById('status').textContent=employeeId?'此名單供主管、中階主管與教保同仁查看。':'請先從登入首頁登入，再開啟名單。';document.getElementById('refresh').hidden=true;document.getElementById('back').href='index.html'}else{try{const c=JSON.parse(localStorage.getItem(cacheKey)||'null');if(c&&c.date===dateKeys()[0]&&Array.isArray(c.records)&&c.syncedAt){records=approved(c.records.map(x=>({...x,status:'已核准'})));syncedAt=c.syncedAt}}catch(_){}render(!!syncedAt);refresh();document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(shownDate!==dateKeys()[0]){records=[];syncedAt='';render(false)}refresh()}});setInterval(()=>{if(!document.hidden){if(shownDate!==dateKeys()[0]){records=[];syncedAt='';render(false)}refresh()}},60000)}
</script></body></html>
