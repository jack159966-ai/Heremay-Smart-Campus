<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>訊息中心 v1.5.3｜2026-09-30</title>
  <style>
    :root{--blue:#4774b3;--ink:#23344e;--muted:#728096;--line:#d8e4f2;--bg:#edf5fc;--card:#fff;--new:#fff9e9}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
    .app{max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}
    header{display:flex;align-items:center;justify-content:space-between;padding:22px 4px 16px}h1{margin:0;font-size:28px}.back,.action{border:0;border-radius:18px;background:#e2edf9;color:var(--blue);font-size:18px;font-weight:700;padding:14px 18px}
    .person{color:var(--muted);padding:0 5px 15px}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px}.count{font-weight:800;color:var(--blue)}
    .list{display:grid;gap:12px}.item{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 3px 14px #5b789314}.item.new{background:var(--new);border-color:#f1d89d}.top{display:flex;gap:10px;align-items:flex-start}.dot{width:10px;height:10px;border-radius:50%;background:#e39c2e;margin-top:8px;flex:0 0 auto}.item:not(.new) .dot{background:#b8c5d3}.title{font-size:20px;font-weight:800;line-height:1.35;flex:1}.time{font-size:13px;color:var(--muted);white-space:nowrap}.body{margin:10px 0 0 20px;color:#526178;line-height:1.65;white-space:pre-wrap}.meta{margin:10px 0 0 20px;font-size:13px;color:#8794a5}.open{display:inline-block;margin:12px 0 0 20px;color:#fff;background:var(--blue);padding:10px 15px;border-radius:13px;text-decoration:none;font-weight:700}
    .empty,.loading,.error{text-align:center;padding:55px 20px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:22px}.error{color:#b55252}.sound{font-size:14px;color:var(--muted);margin-left:auto}
    @media(max-width:480px){.app{padding-left:12px;padding-right:12px}h1{font-size:25px}.time{display:none}.title{font-size:18px}}
  </style>
</head>
<body>
<main class="app">
  <header><h1>🔔 訊息中心</h1><button class="back" onclick="goBack()">返回</button></header>
  <div class="person" id="person"></div>
  <div class="toolbar"><span class="count" id="count">讀取中…</span><button class="action" id="allRead" onclick="markAllRead()" hidden>全部已讀</button></div>
  <section class="list" id="list"><div class="loading">正在讀取訊息…</div></section>
</main>
<script>
  const PARAMS = Object.fromEntries(new URLSearchParams(location.search).entries());
  const MESSAGE_SERVICE_URL = 'https://script.google.com/macros/s/AKfycbwhJsU-5QiZ3uDd9UCnECd16jpHG_LoweHRIC7TrSf_AH-bDLPUFVeAGB2urQo25zzoVg/exec';
  const identity = {
    employeeId: String(PARAMS.employeeId || ''), account: String(PARAMS.account || PARAMS.email || ''),
    name: String(PARAMS.name || ''), groups: String(PARAMS.groups || PARAMS.group || '')
  };
  let items = [];
  let audioContext=null, pendingSound=false, soundReady=false, loadedOnce=false, loading=false;
  const MEDIA_INBOX='https://heremay-8t.myqnapcloud.com:9444/admin.html';
  document.getElementById('person').textContent = identity.name ? identity.name + ' 的訊息' : '我的訊息';

  function api(action, extra){
    return new Promise((resolve,reject)=>{
      const fn='mc_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      const q=new URLSearchParams(Object.assign({},identity,extra||{},{action,callback:fn}));
      const s=document.createElement('script'); let timer;
      window[fn]=data=>{clearTimeout(timer);delete window[fn];s.remove();data&&data.ok?resolve(data):reject(new Error((data&&data.error)||'連線失敗'));};
      s.onerror=()=>{clearTimeout(timer);delete window[fn];s.remove();reject(new Error('連線失敗'));};
      timer=setTimeout(()=>{delete window[fn];s.remove();reject(new Error('連線逾時'));},15000);
      s.src=MESSAGE_SERVICE_URL+'?'+q.toString(); document.head.appendChild(s);
    });
  }
  async function load(attempt=0){
    if(!identity.employeeId&&!identity.account&&!identity.groups){showError('尚未取得登入身分，請從校園首頁進入。');return;}
    if(loading)return;
    loading=true;
    try{
      const r=await api('list',{limit:100});
      items=r.items||[];
      render(r.unread||0);
      notifyNewest(loadedOnce);
      loadedOnce=true;
    }catch(e){
      if(attempt<2){
        document.getElementById('count').textContent='正在重新連線…';
        document.getElementById('list').innerHTML='<div class="loading">連線較慢，正在自動重試（'+(attempt+1)+'/2）…</div>';
        setTimeout(()=>load(attempt+1),900);
        return;
      }
      showError(e.message);
    }finally{loading=false;}
  }
  function render(unread){
    const unreadItems=items.filter(x=>!x.isRead);
    unread=unreadItems.length;
    document.getElementById('count').textContent=unread?'未讀 '+unread+' 則':'目前沒有未讀訊息';
    document.getElementById('allRead').hidden=!unread;
    const box=document.getElementById('list');
    if(!unreadItems.length){box.innerHTML='<div class="empty">目前沒有未讀訊息</div>';return;}
    box.innerHTML=unreadItems.map(x=>`<article class="item new" onclick="openMessage('${esc(x.id)}')"><div class="top"><i class="dot"></i><div class="title">${html(x.title)}</div><time class="time">${html(x.createdAt)}</time></div>${x.message?`<div class="body">${html(x.message)}</div>`:''}<div class="meta">${html(x.source||'系統')}${x.senderName?'・'+html(x.senderName):''}</div><button class="open" onclick="event.stopPropagation();openMessage('${esc(x.id)}')">${x.link||/粉專|投稿|素材/.test([x.source,x.title].join(' '))?'查看內容':'標記已讀'}</button></article>`).join('');
  }
  async function readOne(id){
    const x=items.find(v=>v.id===id);if(!x||x.isRead)return true;
    x.isRead=true;render(items.filter(v=>!v.isRead).length);
    try{await api('markRead',{notificationId:id});return true;}catch(e){x.isRead=false;render(items.filter(v=>!v.isRead).length);return false;}
  }
  async function openMessage(id){
    const x=items.find(v=>v.id===id);if(!x)return;
    const isMedia=/粉專|投稿|素材/.test([x.source,x.title].join(' '));
    const mediaUrl=new URL(MEDIA_INBOX);
    if(isMedia){
      const submissionId=x.submissionId||x.link?.match(/(?:submissionId|id)=([^&#]+)/)?.[1]||[x.title,x.message].join(' ').match(/\b\d{8}-\d{6}-[a-z0-9]+\b/i)?.[0];
      if(submissionId){try{mediaUrl.searchParams.set('submissionId',decodeURIComponent(submissionId));}catch(e){mediaUrl.searchParams.set('submissionId',submissionId);}}
    }
    const destination=buildAuthenticatedLink(isMedia?mediaUrl.toString():(x.link||''));
    if(isMedia && !destination){
      document.getElementById('count').textContent='無法開啟投稿，通知仍保留';
      return;
    }
    if(destination){
      // 先確認可導向的網址，再沿用既有的已讀同步；同步失敗時保留未讀。
      await readOne(id);
      location.assign(destination);
      return;
    }
    await readOne(id);
    // 沒有目標網址的系統通知只需標記已讀。
  }
  function buildAuthenticatedLink(link){
    try{
      if(!link)return '';
      const url=new URL(link,location.href);
      const file=url.pathname.split('/').pop().toLowerCase();

      // 所有校園內頁都延續訊息中心已取得的登入身分。
      if(identity.employeeId)url.searchParams.set('employeeId',identity.employeeId);
      if(identity.account)url.searchParams.set('account',identity.account);
      if(identity.name)url.searchParams.set('name',identity.name);
      if(identity.groups)url.searchParams.set('groups',identity.groups);

      // 粉專主管收件匣沿用既有的 admin / adminId 參數名稱。
      if(file==='media_admin.html'||isMediaInbox(url)){
        // NAS 收件匣另有管理員驗證；缺少首頁員工編號時仍須能開啟收件匣。
        if(identity.name)url.searchParams.set('admin',identity.name);
        if(identity.employeeId||identity.account)url.searchParams.set('adminId',identity.employeeId||identity.account);
      }
      return url.toString();
    }catch(e){
      return '';
    }
  }
  function isMediaInbox(url){return url.hostname==='heremay-8t.myqnapcloud.com'&&url.pathname==='/admin.html';}
  async function markAllRead(){
    try{await api('markAllRead');items.forEach(x=>x.isRead=true);render(0);}catch(e){showError(e.message);}
  }
  function notifyNewest(allowSound){
    const ids=items.filter(v=>!v.isRead).map(v=>v.id);
    const key='heremay.messageCenter.seenIds';
    let prior=[];try{prior=JSON.parse(sessionStorage.getItem(key)||'[]')}catch(e){}
    if(allowSound&&ids.some(id=>!prior.includes(id)))beep();
    sessionStorage.setItem(key,JSON.stringify(ids));
  }
  async function unlockSound(){
    try{
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      audioContext=audioContext||new C();
      if(audioContext.state!=='running')await audioContext.resume();
      soundReady=audioContext.state==='running';
      if(soundReady&&pendingSound&&!document.hidden){pendingSound=false;beep();}
    }catch(e){soundReady=false;}
  }
  // Retry on ordinary interactions after a browser suspends audio; no dedicated sound button.
  ['pointerdown','touchstart','keydown'].forEach(type=>document.addEventListener(type,unlockSound,{passive:true}));
  function beep(){if(document.hidden)return;if(!soundReady||!audioContext||audioContext.state!=='running'){pendingSound=true;return;}try{const c=audioContext;[740,988,1175].forEach((frequency,i)=>{const o=c.createOscillator(),g=c.createGain(),start=c.currentTime+i*.32;o.type='sine';o.frequency.value=frequency;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.38,start+.03);g.gain.exponentialRampToValueAtTime(.0001,start+.28);o.connect(g);g.connect(c.destination);o.start(start);o.stop(start+.29);});if(navigator.vibrate)navigator.vibrate([180,100,180]);}catch(e){}}
  function goBack(){
    if(PARAMS.back){location.href=PARAMS.back;return;}
    if(history.length>1){history.back();return;}
    location.href='teacher.html';
  }
  function showError(m){document.getElementById('count').textContent='讀取失敗';document.getElementById('list').innerHTML='<div class="error">'+html(m)+'</div>';}
  function html(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function attr(v){return html(v).replace(/`/g,'&#96;')}
  function esc(v){return String(v||'').replace(/['\\]/g,'\\$&')}
  load();
  setInterval(()=>{if(!document.hidden)load();},30000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load();});
</script>
</body>
</html>
