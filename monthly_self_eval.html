<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和美智慧校園｜每月自評</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f8ff;color:#243d55;font:16px/1.5 "Microsoft JhengHei",sans-serif}.app{max-width:820px;margin:auto;padding:16px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}h1{font-size:25px;margin:0}h2{font-size:21px}button,select,input,textarea{font:inherit}button{cursor:pointer;border:1px solid #bfd2ee;background:#eaf2ff;color:#204f90;border-radius:12px;padding:11px 14px;font-weight:bold}button:disabled{opacity:.5;cursor:default}.return{background:#4f86c6;color:white;white-space:nowrap}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.row>*{flex:1;min-width:0}input,select,textarea{border:1px solid #bccfe3;border-radius:10px;padding:10px;width:100%;background:white}.card,details{background:white;border:1px solid #dce5f2;border-radius:16px;padding:14px;margin:12px 0}summary{font-weight:bold;cursor:pointer;color:#174c81}.question{padding:12px 0;border-bottom:1px solid #e7edf5}.scores{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.scores button{padding:9px 0}.scores button.selected{background:#2f68d8;color:white;border-color:#2f68d8}.question small{display:block;color:#576d81}.status{padding:12px;background:#e8f2ff;border-radius:12px;white-space:pre-wrap}.status.error{background:#ffe6e6;color:#a52222;border:2px solid #d33}.record{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #e3eaf4;padding:12px 0}.record button{flex-shrink:0}.sticky{position:sticky;bottom:0;background:#f4f8fff5;padding:10px 0}.version{font-size:12px;color:#647b90}textarea{min-height:100px}[hidden]{display:none!important}.totals{font-weight:bold;color:#204f90}
.filterRow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}.filterRow label{display:block;min-width:0;overflow:hidden}.filterRow input,.filterRow select{display:block;width:100%;min-width:0;max-width:100%;height:46px;margin-top:6px;box-sizing:border-box}.filterRow input[type="month"]{appearance:none;-webkit-appearance:none;text-align:left}.filterRow input::-webkit-date-and-time-value{text-align:left;min-width:0}
.notificationSettings label{display:flex;align-items:center;gap:10px;font-weight:bold}.notificationSettings input{width:22px;height:22px;padding:0;flex:0 0 auto}.notificationSettings small{display:block;margin-top:8px;color:#576d81}
</style></head><body><main class="app"><header><div><h1>📝 每月自評</h1><div class="version">v1.0.3｜2026-10-13</div></div><button class="return" id="back">← 返回</button></header><div id="status" class="status" role="status">正在讀取，請稍候…</div><div class="row"><button id="current">本月任務</button><button id="history">歷史紀錄</button><button id="retry">重新讀取</button></div><section class="card notificationSettings" id="notificationSettings" hidden><label><input type="checkbox" id="receiveSelfEval">接收自評通知</label><small>只設定自己的帳號；老師送出新自評時通知。預設只有園長接收。</small></section><section id="listPanel" hidden><div class="row filterRow"><label>評量月份<input id="month" type="month"></label><label id="deptLabel" hidden>部門<select id="department"><option value="">全部</option><option>幼兒部</option><option>安親部</option></select></label></div><div id="roster" class="card" hidden></div><div id="records" class="card"></div></section><section id="formPanel" hidden><h2 id="formTitle"></h2><div id="formMeta"></div><div id="questions"></div><div class="card" id="commentPanel" hidden><label>園長評語<textarea id="comment" maxlength="4000"></textarea></label></div><div id="totals" class="totals"></div><div class="row sticky" id="actions"><button id="draft">暫存</button><button id="submit">送出自評</button><button id="review" hidden>複檢存檔並回傳</button></div></section></main><script src="self_eval_client.js?v=1.0.0"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);let boot,record,scores=[],mode='teacher',busy=false,isHistory=false,pending=null;const savedRecords=new Map();const target=new URLSearchParams(location.search).get('id');
function status(message,error=false){$('status').textContent=message;$('status').classList.toggle('error',error)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draftKey(){return 'heremay.selfEval.draft.'+boot.employee.employeeNo+'.'+record.id+'.'+mode}function keep(){try{localStorage.setItem(draftKey(),JSON.stringify({revision:record.revision||0,scores,comment:$('comment').value}))}catch(_){status('手機暫存空間不足，請按暫存保存到系統',true)}}function total(a){return a.reduce((s,n)=>s+(n||0),0)}function totals(){$('totals').textContent='老師：'+total(record.teacherScores||[])+'／100分'+(mode==='teacher'&&record.status==='草稿'?'（目前填寫 '+scores.filter(Number.isInteger).length+'／20題）':'')+(mode==='review'?'　園長：'+total(scores)+'／100分':record.status==='已複檢'?'　園長：'+total(record.principalScores)+'／100分':'')}
function showForm(r){record=r;mode=boot.role==='admin'?'review':'teacher';const editable=mode==='review'||r.status==='草稿';scores=(mode==='review'?r.principalScores:r.teacherScores||Array(20).fill(null)).slice();$('comment').value=r.comment||'';if(editable)try{const cache=JSON.parse(localStorage.getItem(draftKey())||'null');if(cache&&cache.revision===(r.revision||0)){scores=cache.scores;$('comment').value=cache.comment||''}}catch(_){}if(mode==='teacher'&&editable)record.teacherScores=scores.slice();$('listPanel').hidden=true;$('formPanel').hidden=false;$('formTitle').textContent=r.month+'｜'+r.name+'｜'+r.department;$('formMeta').textContent='狀態：'+r.status+(r.submittedAt?'　送出：'+new Date(r.submittedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'')+(r.reviewedAt?'　複檢：'+new Date(r.reviewedAt).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'｜'+r.reviewer:'');$('commentPanel').hidden=mode!=='review'&&r.status!=='已複檢';$('comment').readOnly=!editable;$('actions').hidden=!editable;$('draft').hidden=mode!=='teacher';$('submit').hidden=mode!=='teacher';$('review').hidden=mode!=='review';const bank=boot.banks[r.version];if(!bank){status('找不到此紀錄的題目版本',true);$('actions').hidden=true;return}$('questions').replaceChildren();let index=0;bank.groups.forEach((g,gi)=>{const d=document.createElement('details');d.open=editable?gi===0:true;const summary=document.createElement('summary');summary.textContent=g.name;d.append(summary);g.items.forEach(text=>{const i=index++,q=document.createElement('div');q.className='question';const label=document.createElement('div');label.textContent=(i+1)+'. '+text;q.append(label);if(mode==='review'||!editable){const value=document.createElement('small');value.textContent='老師：'+r.teacherScores[i]+' 分'+(r.status==='已複檢'?'　園長：'+r.principalScores[i]+' 分':'');q.append(value)}if(editable){const row=document.createElement('div');row.className='scores';for(let n=1;n<=5;n++){const b=document.createElement('button');b.textContent=n;b.setAttribute('aria-label','第'+(i+1)+'題 '+n+'分');b.setAttribute('aria-pressed',String(scores[i]===n));b.classList.toggle('selected',scores[i]===n);b.onclick=()=>{if(busy)return;scores[i]=n;row.querySelectorAll('button').forEach(btn=>{const active=Number(btn.textContent)===n;btn.classList.toggle('selected',active);btn.setAttribute('aria-pressed',String(active))});if(mode==='teacher')record.teacherScores=scores.slice();pending=null;keep();totals()};row.append(b)}q.append(row)}d.append(q)});$('questions').append(d)});totals();status(editable?'每題選1～5分；可先暫存再繼續。':'此表已送出，可查看紀錄與複檢結果。');scrollTo({top:0,behavior:'smooth'})}
async function openRecord(id){try{status('正在讀取評量…');const r=await HeremaySelfEval.call('selfEvalGet',{id});if(!r.record)throw Error('找不到這份紀錄');showForm(r.record)}catch(e){status(e.message,true)}}
async function task(){if(busy)return;isHistory=false;$('month').value=boot.month;if(boot.role==='admin'){await list();return}if(!boot.opened){$('formPanel').hidden=true;status('每月4日開放上個月自評，可先查看歷史紀錄。');return}const id=boot.employee.employeeNo+'_'+boot.month;status('正在讀取本月任務…');const data=await HeremaySelfEval.call('selfEvalGet',{id});showForm(data.record||{id,month:boot.month,employeeNo:boot.employee.employeeNo,name:boot.employee.name,department:boot.employee.department,version:boot.employee.department+'-v1',teacherScores:Array(20).fill(null),principalScores:Array(20).fill(null),status:'草稿',revision:0})}
async function list(){if(busy)return;status('正在讀取紀錄清單…');$('formPanel').hidden=true;$('listPanel').hidden=false;const r=await HeremaySelfEval.call('selfEvalList',{month:$('month').value,history:isHistory?'yes':'no'});const dept=$('department').value;const merged=new Map([...savedRecords.values()].map(x=>[x.id,x]));r.items.forEach(x=>merged.set(x.id,x));const items=[...merged.values()].filter(x=>(!$('month').value||x.month===$('month').value)&&(!dept||x.department===dept)).sort((a,b)=>b.month.localeCompare(a.month)||a.name.localeCompare(b.name));$('records').replaceChildren();items.filter(x=>boot.role!=='admin'||x.status!=='草稿').forEach(x=>{const row=document.createElement('div');row.className='record';const text=document.createElement('div');text.textContent=x.month+'｜'+x.name+'｜'+x.status;const b=document.createElement('button');b.textContent=boot.role==='admin'?'查看／複檢':'查看';b.onclick=()=>openRecord(x.id);row.append(text,b);$('records').append(row)});if(!$('records').children.length)$('records').textContent='尚無已送出的紀錄。';$('roster').hidden=boot.role!=='admin'||isHistory;if(!$('roster').hidden){const eligible=boot.roster.filter(e=>!dept||e.department===dept);$('roster').textContent='已交：'+eligible.filter(e=>items.some(x=>x.employeeNo===e.employeeNo&&x.status!=='草稿')).map(e=>e.name).join('、')+'\n未交：'+eligible.filter(e=>!items.some(x=>x.employeeNo===e.employeeNo&&x.status!=='草稿')).map(e=>e.name).join('、');$('roster').style.whiteSpace='pre-wrap'}status(isHistory?'歷史紀錄依年月排列；點選才讀取完整評分。':'可自行挑選已交表格複檢。')}
async function save(action){if(busy)return;if(action!=='selfEvalDraft'&&scores.some(x=>!Number.isInteger(x))){status('尚有題目未評分，請完成20題後送出。',true);$('questions').querySelectorAll('details').forEach(d=>d.open=true);return}if(action==='selfEvalSubmit'&&!confirm('送出後不能再修改，確定送出？'))return;busy=true;$('actions').querySelectorAll('button').forEach(b=>b.disabled=true);keep();pending=pending?.action===action?pending:{action,mutationId:crypto.randomUUID()};try{status(action==='selfEvalDraft'?'正在暫存…':'正在存檔並安排通知…');const r=await HeremaySelfEval.call(action,{payload:{id:record.id,month:record.month,expectedRevision:record.revision||0,mutationId:pending.mutationId,scores,comment:$('comment').value}});localStorage.removeItem(draftKey());pending=null;savedRecords.set(r.record.id,r.record);showForm(r.record);status(action==='selfEvalDraft'?'已暫存，可以稍後繼續。':action==='selfEvalSubmit'?'已送出，系統已安排通知園長。':'複檢已存檔，系統已安排通知老師。')}catch(e){status(e.message+'\n填寫內容已保留。',true)}finally{busy=false;$('actions').querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function init(){try{status('正在讀取，請稍候…');boot=await HeremaySelfEval.call('selfEvalBootstrap');$('month').value=boot.month;$('deptLabel').hidden=boot.role!=='admin';$('notificationSettings').hidden=boot.role!=='admin';$('receiveSelfEval').checked=boot.receiveSelfEval===true;$('back').onclick=()=>location.href=boot.role==='admin'?'admin.html':boot.employee.homeType==='中階主管首頁'?'leader.html':'teacher.html';target?await openRecord(target):await task()}catch(e){status(e.message,true)}}
$('receiveSelfEval').onchange=async()=>{const box=$('receiveSelfEval'),before=boot.receiveSelfEval===true;if(busy){box.checked=before;return}box.disabled=true;busy=true;try{const result=await HeremaySelfEval.call('selfEvalPreference',{enabled:box.checked?'yes':'no'});boot.receiveSelfEval=result.receiveSelfEval;box.checked=boot.receiveSelfEval;status(box.checked?'已開啟：之後老師送出自評會通知你。':'已關閉：之後老師送出自評不會通知你。')}catch(e){box.checked=before;status(e.message,true)}finally{box.disabled=false;busy=false}};
$('current').onclick=()=>task().catch(e=>status(e.message,true));$('history').onclick=()=>{isHistory=true;$('month').value='';list().catch(e=>status(e.message,true))};$('retry').onclick=()=>{if(!busy)(isHistory?list():init()).catch(e=>status(e.message,true))};$('month').onchange=$('department').onchange=()=>list().catch(e=>status(e.message,true));$('draft').onclick=()=>save('selfEvalDraft');$('submit').onclick=()=>save('selfEvalSubmit');$('review').onclick=()=>save('selfEvalReview');$('comment').oninput=()=>{pending=null;keep()};$('back').onclick=()=>location.href='teacher.html';init();
})();
</script></body></html>
