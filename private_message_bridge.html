<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="robots" content="noindex"></head>
<body>
<script>
try{
  const payload=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  const message={type:'HEREMAY_PRIVATE_API_RESULT',payload};
  window.parent.postMessage(message,'*');
  if(window.top!==window.parent)window.top.postMessage(message,'*');
}catch(error){
  const message={type:'HEREMAY_PRIVATE_API_RESULT',payload:{requestId:'',result:{ok:false,error:'私訊回傳解析失敗'}}};
  window.parent.postMessage(message,'*');
  if(window.top!==window.parent)window.top.postMessage(message,'*');
}
</script>
</body>
</html>
