<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="robots" content="noindex"></head>
<body>
<script>
try{
  const payload=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  window.parent.postMessage({type:'HEREMAY_PRIVATE_API_RESULT',payload},location.origin);
}catch(error){
  window.parent.postMessage({type:'HEREMAY_PRIVATE_API_RESULT',payload:{requestId:'',result:{ok:false,error:'私訊回傳解析失敗'}}},location.origin);
}
</script>
</body>
</html>
