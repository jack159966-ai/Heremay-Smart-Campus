<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>和美智慧校園｜請假管理 v1.5.1</title>
<style>
:root{--blue:#2f68d8;--deep:#173f75;--line:#dfe8f6;--bg:#f4f8ff}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:linear-gradient(180deg,#f6f9ff,#eef7ff);color:#20323d;min-height:100vh}
.app{width:min(820px,100%);margin:auto;padding:14px 12px 34px}
.header{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;margin-bottom:14px}
.back{border:1px solid #cfe2ff;background:#edf4ff;color:#245fc2;border-radius:16px;padding:13px 18px;font-size:16px;font-weight:950;cursor:pointer;min-width:112px}
.header h1{margin:0;color:#12386f;font-size:28px}.header small{color:#6d8095;font-weight:800}.headerActions{display:flex;gap:10px;align-items:center}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:14px;box-shadow:0 10px 28px rgba(45,82,132,.10)}
.title{margin:0 0 12px;color:#153e72;font-size:23px;font-weight:950;display:flex;align-items:center;gap:8px}
.count{margin-left:auto;background:#fff2e8;color:#e86f1d;border-radius:999px;padding:6px 12px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.box{border:1px solid var(--line);border-radius:18px;padding:13px}.box h3{margin:0 0 8px;color:#2461c6}
.item{border-top:1px dashed #e3eaf4;padding:9px 0;font-weight:800;color:#294e62}.item:first-child{border-top:0}
.hint{background:#f5fbff;border:1px solid #d7edf8;border-radius:16px;padding:12px;color:#607987;font-weight:800}
.calHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.calHead button{border:1px solid #cfe2ff;background:#edf4ff;color:#245fc2;border-radius:12px;padding:8px 12px;font-weight:900;cursor:pointer}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.week div{text-align:center;color:#6d8095;font-size:12px;font-weight:900;padding:4px}
.day{min-height:76px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:7px;text-align:left;cursor:pointer}.day.empty{visibility:hidden}.day.has{background:#f4f9ff;border-color:#bdd8ff}.num{font-weight:950;color:#183f73}.people{display:block;margin-top:8px;font-weight:950;font-size:14px}.people.blue{color:#2f68d8}.people.yellow{color:#c58a00}.people.orange{color:#e67818}.people.red{color:#d9364f}.split{display:block;margin-top:3px;color:#6d8095;font-size:11px;font-weight:800}
.mask{position:fixed;inset:0;background:rgba(18,42,58,.32);display:none;align-items:flex-end;justify-content:center;padding:12px}.mask.show{display:flex}.modal{width:min(620px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:26px;padding:18px}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#edf4ff;color:#245fc2;border-radius:12px;padding:8px 11px;font-weight:900}
.version{text-align:center;color:#7890a6;font-size:12px;font-weight:800}
.reviewCard{border:1px solid #f3b8c0;background:#fff7f8;border-radius:18px;padding:13px;margin-top:10px}
.reviewTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.reviewBadge{background:#ffe5e9;color:#b7394c;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:950;white-space:nowrap}
.reviewMeta{margin-top:7px;color:#d55f18;font-size:13px;font-weight:900;line-height:1.55}.reviewMeta.critical{color:#c92f47}
.reviewActions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.reviewBtn{border:1px solid #cfe2ff;background:#edf4ff;color:#245fc2;border-radius:12px;padding:10px 8px;font-weight:950;cursor:pointer}
.reviewBtn.ok{background:#e9f8ef;border-color:#bfe3cc;color:#23794f}
.reviewBtn.warn{background:#fff6e7;border-color:#ffd79a;color:#986000}
.reviewBtn.no{background:#ffe9ed;border-color:#f4c1ca;color:#b84154}.reviewBtn:disabled{opacity:.55;cursor:wait}
.reviewEmpty{background:#f5fbff;border:1px solid #d7edf8;border-radius:16px;padding:12px;color:#607987;font-weight:800}

@media(max-width:620px){.grid2{grid-template-columns:1fr}.day{min-height:64px;padding:5px}.header{grid-template-columns:1fr}.header h1{font-size:23px}.headerActions{width:100%}.headerActions .back{flex:1}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <div><h1>🏖️ 請假管理</h1><small>主管專用｜今天、明天與每月請假總覽</small></div>
    <div class="headerActions">
      <button class="back" onclick="location.href='admin.html'">← 返回主管頁</button>
      <button class="back" id="refreshBtn" type="button">🔄 重新整理</button>
    </div>
  </header>

  <section class="card">
    <h2 class="title">近期請假</h2>
    <div class="grid2">
      <article class="box"><h3>今天請假</h3><div id="today"></div></article>
      <article class="box"><h3>明天請假</h3><div id="tomorrow"></div></article>
    </div>
  </section>


  <section class="card">
    <h2 class="title">🔴 人力覆核待處理 <span class="count" id="reviewCount">0 筆</span></h2>
    <div class="hint">此區只顯示已觸發人力警戒、尚待主管處理的請假。主管可先確認人力，再決定核准、調度後核准或不宜核准。</div>
    <div id="reviewList"></div>
  </section>

  <section class="card">
    <h2 class="title">請假月曆 <span class="count" id="count">0 筆</span></h2>
    <div class="calHead"><button onclick="changeMonth(-1)">‹ 上個月</button><strong id="monthTitle"></strong><button onclick="changeMonth(1)">下個月 ›</button></div>
    <div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div>
    <div class="calendar" id="calendar"></div>
  </section>

  <div id="loadStatus" class="hint" style="margin-bottom:12px;text-align:center">準備讀取請假資料…</div>
  <div class="version">請假管理 v1.5.1｜2026-08-12｜簡化主管覆核</div>
</main>

<div class="mask" id="mask" onclick="if(event.target.id==='mask')closeModal()"><section class="modal" id="modal"></section></div>

<script>
const SERVICE_URL='https://script.google.com/macros/s/AKfycbzQIkRS3hLLiDMQj6WV6SyeEmFHO80f_Sl9qHciPkWpXZfuzggmfdTRLjtbvhhMZ624Zw/exec';
let leaves=[],view=new Date();
const pad=n=>String(n).padStart(2,'0');
const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
function dateKey(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function jsonp(action,params={}){return new Promise((resolve,reject)=>{const cb='leaveCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),t=setTimeout(()=>{cleanup();reject(new Error('讀取逾時'))},15000);function cleanup(){clearTimeout(t);delete window[cb];s.remove()}window[cb]=d=>{cleanup();resolve(d)};s.onerror=()=>{cleanup();reject(new Error('雲端連線失敗'))};s.src=SERVICE_URL+'?'+new URLSearchParams({action,callback:cb,...params,_:Date.now()});document.head.appendChild(s)})}
function active(x){return !['已取消','駁回','已駁回'].includes(String(x.status||''))}
async function loadData(){
  const btn=document.getElementById('refreshBtn');
  const status=document.getElementById('loadStatus');
  if(btn){btn.disabled=true;btn.textContent='⏳ 讀取中…'}
  if(status)status.textContent='正在連接雲端並讀取請假紀錄…';
  try{
    const r=await jsonp('getDashboardBundle',{target:'主管'});
    if(!r||!r.ok)throw new Error((r&&r.message)||'讀取失敗');
    leaves=Array.isArray(r.leaves)?r.leaves:[];
    localStorage.setItem('heremay.sharedLeaveRecords',JSON.stringify(leaves));
    if(status)status.textContent=`✅ 雲端讀取成功，共 ${leaves.length} 筆請假紀錄`;
  }catch(e){
    let cached=[];
    try{cached=JSON.parse(localStorage.getItem('heremay.sharedLeaveRecords')||'[]')}catch(_){}
    leaves=Array.isArray(cached)?cached:[];
    if(status)status.textContent=`⚠️ 雲端讀取失敗：${e.message}；目前顯示本機備份 ${leaves.length} 筆`;
    console.error('請假資料讀取失敗',e);
  }finally{
    renderAll();
    if(btn){btn.disabled=false;btn.textContent='🔄 重新整理'}
  }
}

function isStaffingReviewPending(x){
  return active(x) &&
    (x.staffingReview===true || String(x.是否觸發人力覆核||'')==='是') &&
    String(x.staffingReviewResult||x.人力覆核結果||'待覆核')==='待覆核';
}
function renderReviewQueue(){
  const rows=leaves.filter(isStaffingReviewPending)
    .sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||String(a.created||'').localeCompare(String(b.created||'')));
  const box=document.getElementById('reviewList');
  const count=document.getElementById('reviewCount');
  if(count)count.textContent=`${rows.length} 筆`;
  if(!box)return;
  if(!rows.length){box.innerHTML='<div class="reviewEmpty">目前沒有待處理的人力覆核。</div>';return}
  box.innerHTML=rows.map(x=>{
    const am=Number(x.staffingAm||x.申請當下上午缺勤數||0);
    const pm=Number(x.staffingPm||x.申請當下下午缺勤數||0);
    const alertText=x.staffingAlert||x.申請當下人力警戒||'紅燈';
    const note=x.staffingReviewNote||x.人力覆核備註||'';
    const leaveId=String(x.leaveId||'').replace(/'/g,"\\'");
    return `<div class="reviewCard">
      <div class="reviewTop">
        <div><strong>${esc(x.date||'')}｜${esc(x.employeeName||'未具名')}｜${esc(x.type||'請假')}・${esc(x.period||'全天')}</strong></div>
        <span class="reviewBadge">${esc(alertText)}</span>
      </div>
      <div class="reviewMeta critical">部門：${esc(x.pool||'')}｜上午缺勤 ${am} 人｜下午缺勤 ${pm} 人｜狀態：${esc(x.status||'待審核')}</div>
      ${note?`<div class="reviewMeta critical">人力備註：${esc(note)}</div>`:''}
      <div class="reviewActions">
        <button class="reviewBtn ok" onclick="chooseReview('${leaveId}','可核准')">可核准</button>
        <button class="reviewBtn no" onclick="chooseReview('${leaveId}','不宜核准')">不宜核准</button>
      </div>
    </div>`;
  }).join('');
}
function reviewerName(){
  try{
    const e=JSON.parse(localStorage.getItem('heremay.currentEmployee')||'null')||{};
    return String(e.name||e['姓名']||e.employeeName||localStorage.getItem('heremay.lastFaceAccount')||'主管').trim()||'主管';
  }catch(_){
    return String(localStorage.getItem('heremay.lastFaceAccount')||'主管').trim()||'主管';
  }
}
async function chooseReview(leaveId,result){
  const row=leaves.find(x=>String(x.leaveId||'')===String(leaveId||''));
  if(!row)return;

  let note='';
  if(result==='不宜核准'){
    note=prompt('可填寫不宜核准原因，讓紀錄更完整。','')||'';
  }

  const ok=confirm(
    `${row.employeeName||''}｜${row.date||''} ${row.period||''}\n`+
    `${row.type||'請假'}｜上午缺勤 ${Number(row.staffingAm||0)} 人｜下午缺勤 ${Number(row.staffingPm||0)} 人\n\n`+
    `確定覆核為「${result}」嗎？`
  );
  if(!ok)return;

  document.querySelectorAll('.reviewBtn').forEach(b=>b.disabled=true);
  const status=document.getElementById('loadStatus');
  if(status)status.textContent='正在寫入主管覆核結果…';

  try{
    const payload={
      leaveId:String(leaveId||''),
      decision:result,
      reviewerName:reviewerName(),
      note:note.trim()
    };
    const r=await jsonp('reviewLeaveStaffing',{payload:JSON.stringify(payload)});
    if(!r||!r.ok)throw new Error((r&&r.message)||'覆核寫入失敗');

    if(status)status.textContent=`✅ ${r.message||'人力覆核已完成'}`;
    await loadData();
  }catch(e){
    if(status)status.textContent=`⚠️ 覆核失敗：${e.message}`;
    alert('覆核失敗：'+e.message);
    document.querySelectorAll('.reviewBtn').forEach(b=>b.disabled=false);
  }
}
function renderList(day,id){const rows=leaves.filter(x=>x.date===day&&active(x)),box=document.getElementById(id);box.innerHTML=rows.length?rows.map(x=>`<div class="item">${esc(x.employeeName||'未具名')}｜${esc(x.period||'全天')}｜${esc(x.type||'請假')}｜${esc(x.status||'')}</div>`).join(''):'<div class="hint">無人請假。</div>'}
function changeMonth(n){view.setMonth(view.getMonth()+n);renderCalendar()}
function leaveCountClass(count){
  const n=Number(count||0);
  if(n>=4)return 'red';
  if(n===3)return 'orange';
  if(n===2)return 'yellow';
  return 'blue';
}
function renderCalendar(){const y=view.getFullYear(),m=view.getMonth(),key=`${y}-${pad(m+1)}`,rows=leaves.filter(x=>String(x.date||'').startsWith(key));document.getElementById('count').textContent=`${rows.length} 筆`;document.getElementById('monthTitle').textContent=`${y} 年 ${m+1} 月`;const box=document.getElementById('calendar');box.innerHTML='';const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();for(let i=0;i<first;i++){const e=document.createElement('div');e.className='day empty';box.appendChild(e)}for(let d=1;d<=days;d++){const dk=`${y}-${pad(m+1)}-${pad(d)}`,dr=rows.filter(x=>x.date===dk&&active(x));let am=0,pm=0;dr.forEach(x=>{const p=String(x.period||'');if(p==='全天'){am++;pm++}else if(p==='上午')am++;else if(p==='下午')pm++});const risk=Math.max(am,pm),level=leaveCountClass(risk);const b=document.createElement('button');b.className='day'+(dr.length?' has':'');b.innerHTML=`<span class="num">${d}</span>${dr.length?`<span class="people ${level}">${dr.length} 人</span><span class="split">上午 ${am}｜下午 ${pm}</span>`:''}`;b.onclick=()=>showDay(dk,dr);box.appendChild(b)}}
function showDay(date,rows){document.getElementById('modal').innerHTML=`<div class="modalHead"><h3>${esc(date)} 請假名單</h3><button class="close" onclick="closeModal()">關閉</button></div>${rows.length?rows.map(x=>`<div class="item"><strong>${esc(x.employeeName||'未具名')}</strong>｜${esc(x.type||'請假')}｜${esc(x.period||'全天')}<br><small>部門：${esc(x.pool||'')}｜狀態：${esc(x.status||'')}｜申請：${esc(x.created||'')}</small></div>`).join(''):'<div class="hint">當天沒有人請假。</div>'}`;document.getElementById('mask').classList.add('show')}
function closeModal(){document.getElementById('mask').classList.remove('show')}
function renderAll(){renderReviewQueue();renderList(dateKey(0),'today');renderList(dateKey(1),'tomorrow');renderCalendar()}
document.getElementById('refreshBtn').addEventListener('click',loadData);
loadData();
</script>
</body>
</html>
