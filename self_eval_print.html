<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>和美智慧校園｜自評列印成冊</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#223b55;font:16px/1.5 "Microsoft JhengHei","Noto Sans CJK TC",sans-serif}.controls{max-width:980px;margin:0 auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:14px}h1{font-size:25px;margin:0}.version{font-size:12px;color:#63768a}button,input,select{font:inherit}button{border:1px solid #b8cce5;border-radius:10px;padding:10px 16px;background:#e8f1ff;color:#244e85;cursor:pointer;font-weight:700}button:disabled{opacity:.5;cursor:default}.back{background:#4f86c6;color:white;white-space:nowrap}.card{border:1px solid #d3dfea;border-radius:15px;background:white;padding:16px;margin-top:14px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}label{display:block;min-width:0;font-weight:700;font-size:14px}select{width:100%;min-width:0;padding:9px;border:1px solid #bacbdc;border-radius:9px;background:#fff;margin-top:5px}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}.status{white-space:pre-wrap;padding:12px;border-radius:10px;background:#e7f0ff;margin-top:12px}.status.error{background:#ffe8e8;color:#982424}.note{font-size:14px;color:#5a7084;margin:10px 0 0}#previewWrap{overflow-x:auto;padding:0 12px 20px}#preview:empty{display:none}.sheet{width:180mm;height:277mm;margin:20px auto;padding:0;background:white;color:#111;position:relative;box-shadow:0 3px 15px #223b5520;font-family:"Microsoft JhengHei","Noto Sans CJK TC",sans-serif}.sheetContent{padding:0}.sheetHeader{display:block;text-align:center;margin-bottom:2mm;padding-top:1mm}.sheetHeader h2{font-size:14pt;line-height:1.15;margin:0 0 1.3mm;font-weight:700}.sheetMeta{display:flex;justify-content:space-between;gap:4mm;font-size:10pt;line-height:1.35}.scoreTable{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12pt;line-height:1.08}.scoreTable th,.scoreTable td{border:.2mm solid #555;padding:.35mm .6mm;text-align:center;vertical-align:middle}.scoreTable th{background:#f0f0f0;font-weight:700}.scoreTable .question{text-align:left;font-size:12pt;line-height:1.08}.scoreTable .monthStart{border-left:.4mm solid #333}.scoreTable .sum{font-weight:700}.scoreTable .monthState{font-size:10pt;line-height:1.3}.legend{font-size:10pt;line-height:1.25;margin:1.3mm 0}.comments{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12pt;line-height:1.15}.comments th,.comments td{border:.2mm solid #555;padding:1mm;vertical-align:top}.comments th{background:#f0f0f0;text-align:center;font-size:12pt}.commentText{white-space:pre-wrap;overflow-wrap:anywhere;min-height:10mm}.reviewer{font-size:10pt;margin-top:1mm;color:#444}.sheetFooter{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-between;font-size:10pt;line-height:1.3;border-top:.2mm solid #999;padding-top:1mm}.continuation{font-size:10pt;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}.continuation h3{font-size:12pt;line-height:1.3;margin:3mm 0 2mm}.emptyMessage{padding:12mm 0;text-align:center;font-size:12pt}.pageBodyLimit{height:270mm;width:100%;position:absolute;visibility:hidden;pointer-events:none;top:0}body[data-ready="false"] #printNow{pointer-events:none}[hidden]{display:none!important}
@media(max-width:680px){.controls{padding:14px}.filters{grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}h1{font-size:21px}}
@page{size:A4 portrait;margin:10mm 10mm 10mm 20mm}
@media print{body{background:white;margin:0;color:#111}.controls{display:none!important}#previewWrap{padding:0;overflow:visible}.sheet{margin:0;padding:0;box-shadow:none;break-after:page;page-break-after:always;width:180mm;height:277mm;break-inside:avoid;page-break-inside:avoid}.sheet:last-child{break-after:auto;page-break-after:auto}th{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body data-ready="false">
<main class="controls"><header><div><h1>自評列印成冊</h1><div class="version">v1.1.0｜電腦列印</div></div><button class="back" type="button" onclick="location.href='monthly_self_eval.html?v=1.1.0'">← 返回</button></header>
<section class="card"><div class="filters"><label>老師<select id="teacher" disabled><option>正在讀取…</option></select></label><label>開始學期<select id="fromTerm" disabled></select></label><label>結束學期<select id="toTerm" disabled></select></label></div><div class="actions"><button id="load" type="button" disabled>產生列印預覽</button><button id="printNow" type="button" disabled>列印／另存 PDF</button></div><p class="note">每位老師各自成冊。2～7月一頁；8月～隔年1月一頁。A4 直式，左側留 20 mm 裝訂空間。</p><p class="note">列印請關閉瀏覽器的「頁首及頁尾」，縮放選 100%。未提交與未複審月份會標示清楚；很長的評語另附續頁，保留全文。</p></section>
<div id="status" class="status" role="status">正在讀取老師與學期…</div></main>
<div id="previewWrap"><div id="preview"></div></div>
<script src="self_eval_client.js?v=1.0.0"></script><script src="self_eval_print_model.js?v=1.1.0"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),model=SelfEvalPrintModel;let index,busy=false,generation=0;const teachers=new Map();
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error)}
function element(tag,text,className){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(className)e.className=className;return e}
function option(select,value,label){const o=element('option',label);o.value=value;select.append(o)}
function setReady(ready){document.body.dataset.ready=String(ready);$('printNow').disabled=!ready}
function invalidate(){generation++;setReady(false);$('preview').replaceChildren();status('條件已變更，請重新產生列印預覽。')}
function formatMonth(month){return Number(month.split('-')[1])+'月'}
function basePage(page,teacher,subtitle){const sheet=element('article',undefined,'sheet'),body=element('div',undefined,'sheetContent'),header=element('header',undefined,'sheetHeader');header.append(element('h2','和美幼兒園｜教保人員每月自評紀錄'));const meta=element('div',undefined,'sheetMeta');meta.append(element('span','姓名：'+teacher.name+'　員工編號：'+teacher.employeeNo+'　部門：'+(page.department||teacher.department)),element('span',model.label(page.term)+(subtitle?'｜'+subtitle:'')));header.append(meta);body.append(header);sheet.append(body,element('div',undefined,'sheetFooter'));return {sheet,body}}
function cell(row,tag,text,span,className){const c=element(tag,text,className);if(span)c.colSpan=span;row.append(c);return c}
function recordState(page,month){const r=page.byMonth?.get(month);return r?r.status==='已複檢'?'已複審':'待複審':page.otherMonths?.includes(month)?'另一題庫版本':'無已交紀錄'}
function scorePage(page,teacher){const {sheet,body}=basePage(page,teacher);if(page.empty){body.append(element('div','此學期沒有已送出的自評紀錄。','emptyMessage'));return {sheet,body,comments:[]}}
const table=element('table',undefined,'scoreTable'),cols=element('colgroup');for(const width of ['6mm','90mm',...Array(12).fill('7mm')]){const col=element('col');col.style.width=width;cols.append(col)}table.append(cols);const head=element('thead'),r1=element('tr');const n=cell(r1,'th','題號');n.rowSpan=2;const q=cell(r1,'th','評量內容');q.rowSpan=2;page.months.forEach(m=>cell(r1,'th',formatMonth(m),2,'monthStart'));const r2=element('tr');page.months.forEach(()=>{cell(r2,'th','自評',1,'monthStart');cell(r2,'th','複評')});head.append(r1,r2);table.append(head);const tbody=element('tbody');page.questions.forEach((question,i)=>{const row=element('tr');cell(row,'td',String(i+1));cell(row,'td',question,1,'question');page.months.forEach(m=>{const r=page.byMonth.get(m);cell(row,'td',model.score(r,'teacher',i),1,'monthStart');cell(row,'td',model.score(r,'principal',i))});tbody.append(row)});const totals=element('tr');cell(totals,'td','總分（滿分100分）',2,'sum');page.months.forEach(m=>{const r=page.byMonth.get(m);cell(totals,'td',model.total(r,'teacher'),1,'sum monthStart');cell(totals,'td',model.total(r,'principal'),1,'sum')});tbody.append(totals);const states=element('tr');cell(states,'td','紀錄狀態',2);page.months.forEach(m=>cell(states,'td',recordState(page,m),2,'monthState monthStart'));tbody.append(states);table.append(tbody);body.append(table,element('p','自評＝老師已提交分數；複評＝主管已存檔分數。空白欄位沒有正式分數。'+(page.split?'本學期有不同題庫版本，按版本分頁。':''),'legend'));
const comments=element('table',undefined,'comments'),h=element('tr'),row=element('tr'),targets=[];page.months.forEach(m=>{cell(h,'th',formatMonth(m)+'評語');const td=cell(row,'td',''),r=page.byMonth.get(m),text=r?.status==='已複檢'?r.comment||'':'';const block=element('div',text||'—','commentText');td.append(block);if(r?.status==='已複檢'&&r.reviewer)td.append(element('div','複審：'+r.reviewer,'reviewer'));targets.push({month:m,text,block})});comments.append(h,row);body.append(comments);return {sheet,body,comments:targets}}
function fits(body){return body.getBoundingClientRect().height<=270*96/25.4+.5}
async function preparePages(data,teacher,from,to){const pages=model.build(data.records,data.banks,from,to),preview=$('preview');preview.replaceChildren();if(!data.records.length){status('這位老師在所選學期沒有已送出的紀錄，請調整學期。');return false}await document.fonts.ready;
for(const page of pages){const main=scorePage(page,teacher);preview.append(main.sheet);if(!fits(main.body)){
 const full=main.comments.filter(x=>x.text);full.forEach(x=>x.block.textContent='完整評語見續頁');if(!fits(main.body))throw Error('此題庫內容超出一頁，請先檢查題目長度。');
 for(const item of full){let remaining=item.text;while(remaining){const continuation=basePage(page,teacher,'園長評語續頁'),area=element('div',undefined,'continuation');area.append(element('h3',formatMonth(item.month)+'｜完整評語'));const paragraph=element('div');area.append(paragraph);continuation.body.append(area);preview.append(continuation.sheet);paragraph.textContent=remaining;if(fits(continuation.body)){remaining='';continue}let low=0,high=remaining.length;while(low<high){const mid=Math.ceil((low+high)/2);paragraph.textContent=remaining.slice(0,mid);if(fits(continuation.body))low=mid;else high=mid-1}if(low===0)throw Error('評語續頁無法排版，請重新讀取。');const chars=Array.from(remaining.slice(0,low));if(/[\uD800-\uDBFF]$/.test(chars[chars.length-1]||''))low--;paragraph.textContent=remaining.slice(0,low);remaining=remaining.slice(low)} }
 }}
const sheets=[...preview.querySelectorAll('.sheet')];sheets.forEach((sheet,i)=>{const footer=sheet.querySelector('.sheetFooter');footer.append(element('span','老師：'+teacher.name+'｜自評紀錄冊'),element('span','第 '+(i+1)+'／'+sheets.length+' 頁'))});return true}
async function load(){if(busy)return;const employeeNo=$('teacher').value,from=$('fromTerm').value,to=$('toTerm').value;let teacher=teachers.get(employeeNo);if(!teacher){status('請先選擇老師。',true);return}try{model.terms(from,to)}catch(e){status(e.message,true);return}busy=true;setReady(false);$('preview').replaceChildren();const token=++generation;$('load').disabled=true;[$('teacher'),$('fromTerm'),$('toTerm')].forEach(e=>e.disabled=true);try{status('正在讀取已存檔評分，產生列印預覽…');const result=await HeremaySelfEval.call('selfEvalPrint',{employeeNo,fromTerm:from,toTerm:to});if(token!==generation)return;const ready=await preparePages(result,teacher,from,to);setReady(ready);if(ready)status('已產生 '+$('preview').children.length+' 頁。請核對老師、學期與分數後列印。')}catch(e){$('preview').replaceChildren();setReady(false);status(e.message,true)}finally{busy=false;$('load').disabled=false;[$('teacher'),$('fromTerm'),$('toTerm')].forEach(e=>e.disabled=false)}}
async function init(){try{index=await HeremaySelfEval.call('selfEvalPrintIndex');$('teacher').replaceChildren();option($('teacher'),'','請選擇老師');index.teachers.forEach(t=>{teachers.set(String(t.employeeNo),t);option($('teacher'),String(t.employeeNo),t.department+'｜'+t.name+'（'+t.employeeNo+'）')});const current=model.termFor(index.month),all=[...new Set([...index.months.map(model.termFor),current])].sort();for(const term of all){option($('fromTerm'),term,model.label(term));option($('toTerm'),term,model.label(term))}$('fromTerm').value=$('toTerm').value=current;[$('teacher'),$('fromTerm'),$('toTerm'),$('load')].forEach(e=>e.disabled=false);status('請選擇老師與學期範圍，再產生列印預覽。')}catch(e){status(e.message+'\n請返回自評管理頁確認主管登入，或檢查後端是否已部署新版本。',true)}}
[$('teacher'),$('fromTerm'),$('toTerm')].forEach(e=>e.onchange=invalidate);$('load').onclick=load;$('printNow').onclick=()=>{if(!$('printNow').disabled)window.print()};init();
})();
</script></body></html>
